<style>
/* Layout: guscio da telefono — carta d'identità + statistiche in alto, contenuto della scheda che scorre, barra in basso con sei schede e il pulsante centrale "+1 anno" */
:root{
  --bg:#ECEFE8; --surface:#FFFFFF; --surface2:#E3E7DD; --ink:#16202A; --muted:#5A6570; --line:#D1D7CB;
  --accent:#2244D6; --accent-ink:#FFFFFF; --accent-soft:rgba(34,68,214,.10);
  --card:#D9E5F1; --card-ink:#1A2A43; --card-label:#4C6286; --guilloche:rgba(34,68,214,.09);
  --salute:#21894F; --felicita:#C98400; --intel:#2C5EE0; --aspetto:#C2386A;
  --good:#1D8049; --bad:#C23B25; --scrim:rgba(10,14,20,.45);
  --shadow:0 1px 2px rgba(22,32,42,.06),0 10px 28px rgba(22,32,42,.10);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151B; --surface:#19212A; --surface2:#232D38; --ink:#E9EEF3; --muted:#97A3AF; --line:#2C3743;
  --accent:#7D98FF; --accent-ink:#0D1424; --accent-soft:rgba(125,152,255,.14);
  --card:#1A283A; --card-ink:#DCE6F4; --card-label:#8EA4C6; --guilloche:rgba(125,152,255,.10);
  --salute:#43C07A; --felicita:#F0B43A; --intel:#7D98FF; --aspetto:#F06F9C;
  --good:#4CC584; --bad:#F2765F; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#19212A; --surface2:#232D38; --ink:#E9EEF3; --muted:#97A3AF; --line:#2C3743;
  --accent:#7D98FF; --accent-ink:#0D1424; --accent-soft:rgba(125,152,255,.14);
  --card:#1A283A; --card-ink:#DCE6F4; --card-label:#8EA4C6; --guilloche:rgba(125,152,255,.10);
  --salute:#43C07A; --felicita:#F0B43A; --intel:#7D98FF; --aspetto:#F06F9C;
  --good:#4CC584; --bad:#F2765F; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
main{flex:1;overflow-y:auto;padding:4px 16px 130px;min-height:0}

/* Carta di vita */
.idcard{background-color:var(--card);color:var(--card-ink);border-radius:16px;padding:12px 14px 14px;position:relative;overflow:hidden;border:1px solid var(--line);
  background-image:repeating-radial-gradient(circle at 88% 20%,var(--guilloche) 0 1px,transparent 1px 7px),repeating-radial-gradient(circle at 10% 120%,var(--guilloche) 0 1px,transparent 1px 9px)}
.id-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.id-head span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--card-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-head button{background:transparent;border:1px solid var(--card-label);color:var(--card-ink);border-radius:999px;padding:3px 10px;font-size:12px;flex:none}
.id-body{display:flex;gap:12px;align-items:flex-start}
.avatar{width:62px;height:76px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;color:#fff;letter-spacing:.02em}
.id-main{min-width:0;flex:1}
.id-name{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;text-wrap:balance;margin:0 0 8px}
.id-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.id-f{min-width:0}
.id-f .l{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--card-label)}
.id-f .v{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.id-f .v.neg{color:var(--bad)}

/* Statistiche */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.stat-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-v{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar{display:block;height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s ease}

/* Diario */
.year{display:grid;grid-template-columns:44px 1fr;gap:0 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.year:last-child{border-bottom:0}
.age{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;text-align:right}
.age small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;color:var(--muted);letter-spacing:.04em}
.lines{display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:2px}
.line{display:grid;grid-template-columns:8px 1fr;gap:8px;align-items:start;font-size:14.5px}
.line::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);margin-top:8px}
.line.g::before{background:var(--good)}
.line.b::before{background:var(--bad)}
.line.h{color:var(--muted);font-size:13.5px}
.empty-line{color:var(--muted);font-size:13.5px;font-style:italic}

/* Sezioni */
.sec{margin:16px 0 7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sec:first-child{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.act:hover:not(:disabled){border-color:var(--accent)}
.act:disabled{opacity:.5;cursor:default}
.act .n{font-weight:600;font-size:15px}
.act .d{font-size:12.5px;color:var(--muted)}
.act .c{font-family:var(--f-mono);font-size:12px;margin-top:4px;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv>span{min-width:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.kv b.pos{color:var(--good)} .kv b.neg{color:var(--bad)}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border:1px solid transparent;border-radius:999px;padding:7px 13px;font-size:13.5px}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.chip.warn{color:var(--bad)}
.chip.pri{background:var(--accent);color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.job{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .jn{font-weight:600;font-size:14.5px}
.job .jm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.job .jr{font-size:12px;color:var(--bad)}
.job>div{min-width:0}
.job .chip{flex:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.person{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list>.person:last-child{border-bottom:0}
.person .pa{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.person .pa.obj{border-radius:10px;background:var(--surface2);color:var(--ink);font-size:16px}
.person .pi{flex:1;min-width:0}
.person .pn{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pr{display:block;font-size:12.5px;color:var(--muted)}
.person .pb{width:64px;flex:none;text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.person.dead{opacity:.5;cursor:default}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-direction:column;gap:8px}
.note{font-size:13.5px;color:var(--muted);padding:4px 0}

/* Barra in basso */
nav{position:fixed;left:0;right:0;bottom:0;padding:0 8px env(safe-area-inset-bottom,0px);background:linear-gradient(to top,var(--bg) 72%,transparent)}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 74px repeat(3,minmax(0,1fr));align-items:end;padding:8px 0 10px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.plus{justify-self:center;width:70px;height:70px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;margin-bottom:2px;transition:transform .12s ease}
.plus b{font-family:var(--f-display);font-weight:800;font-size:24px}
.plus span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.plus:active{transform:scale(.94)}

/* Foglio eventi */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);max-height:88%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sh-k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.sheet p{margin:0 0 16px;font-size:16px;max-width:60ch;white-space:pre-line}
.sheet p.g{color:var(--good)} .sheet p.b{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:13px 14px;text-align:left;font-size:15px;font-weight:500}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{opacity:.45;cursor:default}
.opt.close{background:transparent;border-color:var(--line);text-align:center;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);width:max-content;z-index:15;box-shadow:var(--shadow)}

/* Creazione e necrologio */
.hero{padding:6px 0 2px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin:0;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);margin:8px 0 0;max-width:42ch}
.form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.field label{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obit{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:center;margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.obit .cross{font-family:var(--f-display);font-size:28px;color:var(--muted);line-height:1}
.obit h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.obit .yrs{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.obit p{margin:6px 0 4px;max-width:38ch}
.obit .facts{width:100%;display:flex;flex-direction:column;gap:6px;margin:10px 0 14px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
.obit .btns{width:100%}

.stats.cinque{grid-template-columns:repeat(5,minmax(0,1fr))}
.mondo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 4px;display:flex;flex-direction:column;gap:6px}
.mondo-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.news{font-size:13.5px}
.news b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--accent);margin-right:4px}
.line.n{font-style:italic}
.line.n::before{background:var(--accent);border-radius:1px;transform:rotate(45deg)}
.big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.att-seg{grid-template-columns:repeat(3,1fr);margin:6px 0 4px}
.job.wrap{flex-wrap:wrap}
.job.wrap>div:first-child{flex:1 1 220px}
.cerca{display:flex;flex-direction:column;gap:8px}
.search-in{width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px}
#shR{max-height:50vh;overflow-y:auto}
.att-seg{grid-template-columns:repeat(4,1fr)}
.att-seg button{padding:9px 4px;font-size:13.5px}
button.avatar{border:0;cursor:pointer}
.ora{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 4px;display:flex;flex-direction:column;gap:8px}
.ora .frase{font-size:14.5px;font-weight:500}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ff{align-items:center}
.ff .chip{padding:5px 11px;font-size:12.5px}
.mese-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.incl{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--bad);color:var(--bad);margin-left:4px;white-space:nowrap;vertical-align:1px}
.incl.ok{border-color:var(--good);color:var(--good)}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list>.rrow:last-child{border-bottom:0}
.panel .rrow{border-bottom:0;padding:4px 0 0}
.rrow>div:first-child{min-width:0}
.rrow .jn{font-weight:600;font-size:14.5px}
.rrow .jm{font-size:12.5px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step .chip{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1}
.step b{min-width:44px;text-align:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
@media (max-width:380px){.needs{grid-template-columns:1fr 1fr}.att-seg button{font-size:12.5px}}
.id-btns{display:flex;gap:6px;flex:none}
.avviso{font-size:13px;color:var(--bad);border:1px solid var(--bad);border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.avviso .chip{padding:4px 10px;font-size:12.5px}
textarea.codice{width:100%;min-height:120px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 var(--f-mono);word-break:break-all;resize:vertical}
/* Creazione: il certificato di nascita che si compila dal vivo, l'editor a schede sotto, «Nasci» in basso */
.crea{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.crea-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.crea-top .logo{width:72px}
.crea-top-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.crea-motto{margin:-6px 0 0;color:var(--muted);font-size:14.5px;max-width:44ch}
.cert{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;overflow:hidden}
.cert::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent) 0 78%,var(--felicita) 78%)}
.cert-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cert-k{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:500}
.cert-n{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.cert-dado,.dado{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0;color:var(--ink)}
.cert-dado svg,.dado svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.cert-dado svg circle,.dado svg circle,.btn svg circle{fill:currentColor;stroke:none}
.btn svg{vertical-align:-4px;margin-right:6px}
.cert-main{display:flex;gap:14px;align-items:center}

let _COM=null;
function comuni(){if(!_COM)_COM=COMUNI_RAW.split(';').map(x=>{const [n,s,p]=x.split('|');return {n,s,p:+p}});return _COM}
function trovaComune(n,s){const L=comuni();return L.find(c=>c.n===n&&(!s||c.s===s))||L.find(c=>c.n===n)||null}
function capoluogo(s){const L=comuni().filter(c=>c.s===s);const pn=PROV[s]&&PROV[s].n;return L.find(c=>c.n===pn)||L.sort((a,b)=>b.p-a.p)[0]}
function comuneCaso(){const L=comuni();let t=0;for(const c of L)t+=Math.sqrt(c.p);let x=Math.random()*t;for(const c of L){x-=Math.sqrt(c.p);if(x<=0)return c}return L[0]}
function cittaInfo(n,s){
  const big=CITTA.find(c=>c.n===n);const est=CITTA_ESTERE.find(c=>c.n===n);
  if(est)return {n,mq:est.mq,reg:'Estero',zona:'Estero',estero:true,p:1000000};
  const c=trovaComune(n,s||(S&&S.citta===n?S.prov:null));
  const pr=c?PROV[c.s]:null;
  const reg=pr?pr.r:'Lazio';
  let mq;
  if(big)mq=big.mq;else{const pop=c?c.p:20000;mq=Math.round((REG_MQ[reg]||1500)*Math.max(.6,Math.min(1.25,.65+.13*Math.log10(Math.max(pop,300)/1000)))/10)*10}
  return {n,mq,reg,zona:pr?pr.z:'Centro',s:c?c.s:null,p:c?c.p:0,prov:pr?pr.n:''};
}
function luogo(){return cittaInfo(S.citta,S.prov)}
function nomeLuogo(n,s){const est=CITTA_ESTERE.find(c=>c.n===n);if(est)return n;return s?`${n} (${s})`:n}
function cercaLuoghi(q,esteri){
  q=q.trim().toLowerCase();const out=[];
  if(esteri)for(const c of CITTA_ESTERE)if(!q||c.n.toLowerCase().includes(q))out.push({n:c.n,s:null,estero:true,p:1e6});
  if(!q){CITTA.forEach(c=>{const x=trovaComune(c.n);if(x)out.push(x)});return out}
  const L=comuni();const pre=[],mid=[];
  for(const c of L){const nl=c.n.toLowerCase();if(nl.startsWith(q))pre.push(c);else if(nl.includes(q))mid.push(c)}
  pre.sort((a,b)=>b.p-a.p);mid.sort((a,b)=>b.p-a.p);
  return out.concat(pre,mid);
}

/* ================= SISTEMI: MONDO, TASSE, BORSA, AZIENDA, SOCIAL, FAMA, CRIMINE, NEMICI, DIALOGHI, COLLOQUI ================= */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ip=()=>(S&&S.mondo?S.mondo.ip:1);
const P=x=>Math.round(x*ip());
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ---------- Mondo ---------- */
/* anno: anno di nascita. Chi nasce prima del 2026 trova i prezzi veri di quell'anno (ipAnno in c7_italia.js) */
function mondoBase(anno){const pr={};TITOLI.forEach(t=>pr[t.id]=100);const ip0=anno&&anno<ANNO_OGGI?ipAnno(anno):1;return {ip:ip0,infl:.02,crisi:0,boom:0,pandemia:0,bolla:0,mattone:ip0,pensEta:67,prezzi:pr,var:{},notizie:[]}}
function notizia(t){S.mondo.notizie.push({anno:S.anno,eta:S.eta,t});if(S.mondo.notizie.length>80)S.mondo.notizie.shift();log(t,'n')}
/* Fino al 2026 crisi, pandemie, elezioni e terremoti sono quelli veri (storiaMese in c7_italia.js); dopo, il mondo li inventa */
function annoMondo(){
  const M=S.mondo,anno=S.anno,vero=anno<=ANNO_OGGI;
  if(M.crisi>0){M.crisi--;if(!M.crisi)notizia('L\'economia riparte: la crisi è finita.')}
  if(M.boom>0){M.boom--;if(!M.boom)notizia('Il boom economico rallenta.')}
  if(M.pandemia>0){M.pandemia--;if(!M.pandemia)notizia('La pandemia è finita. Si torna alla normalità.')}
  if(M.bolla>0){M.bolla--;if(!M.bolla){notizia('Scoppia la bolla immobiliare: il valore delle case crolla del 20%.');S.prop.forEach(p=>p.valore=Math.round(p.valore*.8));M.mattone*=.8}}
  if(!vero){
    if(!M.crisi&&!M.boom&&chance(.045)){M.crisi=r(2,3);notizia('Crisi economica: le aziende tagliano posti di lavoro e la Borsa crolla.')}
    else if(!M.crisi&&!M.boom&&chance(.035)){M.boom=r(2,4);notizia('Boom economico: l\'economia corre e le aziende assumono.')}
    if(!M.pandemia&&chance(.012)){M.pandemia=2;notizia('Pandemia: un nuovo virus costringe tutti a restare a casa.');if(S.eta>=3)coda.push({e:EV.lockdown,d:{}})}
    if(!M.bolla&&chance(.02)){M.bolla=r(3,5);notizia('Il mercato immobiliare impazzisce: i prezzi delle case salgono alle stelle.')}
    if(M.pensEta<71&&chance(.015)){M.pensEta++;notizia(`Riforma delle pensioni: ora ci si va a ${M.pensEta} anni.`)}
  }
  M.infl=vero&&INFL_VERA[anno-1]!==undefined?INFL_VERA[anno-1]/100:(M.crisi?r(4,8):M.boom?r(2,4):r(1,3))/100+(M.pandemia?.01:0);
  M.ip*=1+M.infl;
  M.mattone*=1+M.infl+(M.bolla?.06:0)-(M.crisi?.05:0)+r(-2,2)/100;
  for(const t of TITOLI){
    let x=t.drift+t.vol*gauss()+(M.crisi?-.22:0)+(M.boom?.12:0)+(M.pandemia?(t.id==='farma'?.25:t.id==='tech'?.1:-.12):0);
    x=Math.max(-.85,Math.min(3,x));M.var[t.id]=x;M.prezzi[t.id]=Math.max(.5,+(M.prezzi[t.id]*(1+x)).toFixed(2));
  }
  if(vero)return;
  if(anno%4===2&&chance(.07)){notizia('L\'Italia vince i Mondiali di calcio! Si festeggia in tutte le piazze.');mod('felicita',5)}
  if((anno-2022)%5===0&&S.eta>=18&&S.carcere===0)coda.push({e:EV.elezioni,d:{}});
  const L=luogo();
  if(['Centro','Sud','Isole'].includes(L.zona)&&chance(.006))coda.push({e:EV.terremoto,d:{}});
  if(chance(.006))coda.push({e:EV.alluvione,d:{}});
}

/* ---------- Tasse ---------- */
/* Scaglioni IRPEF veri per anno: fino al 2021 cinque aliquote, 2022–23 quattro, 2024–25 tre (23/35/43), dal 2026 23/33/43 (legge 199/2025).
   Dopo il 2026 gli scaglioni seguono i prezzi (fattoreFisco), altrimenti in 60 anni d'inflazione tutti finirebbero al 43%. */
const SCAGLIONI=[[2022,[[15000,.23],[28000,.27],[55000,.38],[75000,.41],[1/0,.43]]],[2024,[[15000,.23],[28000,.25],[50000,.35],[1/0,.43]]],[2026,[[28000,.23],[50000,.35],[1/0,.43]]],[1e9,[[28000,.23],[50000,.33],[1/0,.43]]]];
const annoFisco=()=>S&&S.anno?S.anno:2026;
const fattoreFisco=()=>annoFisco()>2026?Math.max(1,ip()):1;
function irpef(i){
  const sc=SCAGLIONI.find(x=>annoFisco()<x[0])[1],f=fattoreFisco();
  let t=0,da=0;for(const [a,al] of sc){const lim=a*f;if(i>da)t+=(Math.min(i,lim)-da)*al;da=lim}
  return t;
}
function detrazione(r0){const f=fattoreFisco();r0/=f;let d;if(r0<=15000)d=1955;else if(r0<=28000)d=1910+1190*(28000-r0)/13000;else if(r0<=50000)d=1910*(50000-r0)/22000;else d=0;return d*f}
function netto(l){if(l<=0)return 0;const inps=l*.0919,imp=l-inps;const t=Math.max(0,irpef(imp)-detrazione(imp))+imp*.02;return Math.round(l-inps-t)}
function tasseDettaglio(l){const inps=l*.0919,imp=l-inps;const ir=Math.max(0,irpef(imp)-detrazione(imp)),add=imp*.02;return {inps:Math.round(inps),irpef:Math.round(ir),addiz:Math.round(add),netto:Math.round(l-inps-ir-add)}}

/* ---------- Borsa ---------- */
function valoreBorsa(X){X=X||S;let t=0;for(const id in X.borsa)t+=X.borsa[id]*X.mondo.prezzi[id];return Math.round(t)}
function compraTitolo(id,imp){
  const t=TITOLI.find(x=>x.id===id);
  if(S.soldi<imp)return [`Non hai abbastanza soldi (servono ${eur(imp)}).`,'x'];
  S.borsa[id]=(S.borsa[id]||0)+imp/S.mondo.prezzi[id];S.costoBorsa[id]=(S.costoBorsa[id]||0)+imp;soldi(-imp);
  return [`Compri ${eur(imp)} di ${t.n}.`,''];
}
function vendiTitolo(id){
  const t=TITOLI.find(x=>x.id===id),q=S.borsa[id]||0;if(!q)return ['Non possiedi questo titolo.','x'];
  const v=Math.round(q*S.mondo.prezzi[id]),gain=v-(S.costoBorsa[id]||0),tax=gain>0?Math.round(gain*.26):0;
  soldi(v-tax);delete S.borsa[id];delete S.costoBorsa[id];
  return [`Vendi ${t.n} per ${eur(v)}${tax?`, con ${eur(tax)} di tasse sul guadagno`:gain<0?`, in perdita di ${eur(-gain)}`:''}.`,gain>=0?'g':'b'];
}
function dividendi(){let t=0;for(const id in S.borsa){const T0=TITOLI.find(x=>x.id===id);if(T0)t+=S.borsa[id]*S.mondo.prezzi[id]*T0.div}return Math.round(t*.74)}

/* ---------- Prestiti ---------- */
function residuoPrestiti(X){X=X||S;return (X.prestiti||[]).reduce((s,p)=>s+p.residuo,0)}
function chiediPrestito(imp){
  const L=S.lavoro;
  if(!L||JOB[L.id].pt)return ['La banca rifiuta: serve un lavoro stabile.','b'];
  if(S.fatti.crif!==undefined&&S.eta-S.fatti.crif<7)return ['La banca rifiuta: sei segnalat'+g('o','a')+' come cattivo pagatore.','b'];

  if(rata+gia>netto(L.stip)*.35)return [`La banca rifiuta: le rate supererebbero il 35% del tuo stipendio netto.`,'b'];
  S.prestiti.push({n:'Prestito personale',residuo:imp,rata,anni:5,tasso:.085});soldi(imp);
  return [`La banca ti concede ${eur(imp)}. Rata: ${eur(rata)} l'anno per 5 anni.`,''];
}
function annoPrestiti(){
  for(const p of S.prestiti){p.residuo=Math.max(0,Math.round(p.residuo*(1+p.tasso)-p.rata));p.anni--}
  const fin=S.prestiti.filter(p=>p.anni<=0||p.residuo<=0);

const AZ=id=>AZIENDE.find(a=>a.id===id);
function nuovaAzienda(t){
  const nomi={shop:`${S.cognome} Store`,agenzia:`Studio ${S.cognome}`,estetico:`Bellezza ${S.nome}`,startup:`${S.cognome.replace(/\W/g,'')}Lab`,edile:`Costruzioni ${S.cognome}`,bar:`Bar ${S.nome}`,pizzeria:`Pizzeria da ${S.nome}`,palestra:`${S.cognome} Fitness`};
  S.azienda={id:t.id,n:nomi[t.id]||t.n,tipo:t.n,sedi:1,dip:0,prezzo:'medio',qualita:'buona',mkt:0,compenso:15000,cassa:0,rep:50,anni:0,investito:t.costo,ultimo:null};
}
function calcolaAzienda(A,simula){
  const T0=AZ(A.id),Pr=PREZZI_AZ[A.prezzo],Q=QUALITA_AZ[A.qualita],M=MKT_AZ[A.mkt],W=S.mondo;
  const mondo=(W.crisi?.75:1)*(W.boom?1.15:1)*(W.pandemia&&['bar','pizzeria','palestra','estetico'].includes(A.id)?.55:1)*(W.pandemia&&A.id==='shop'?1.4:1);
  const sk=1+(S.abil[T0.sk]-30)/200+(S.intelligenza-50)/400;
  const domanda=Math.round(T0.domanda*A.sedi*Pr.d*M.d*(.5+A.rep/100)*mondo*Math.max(.6,sk)*(1+S.fama/200)*(simula?1:r(85,115)/100));
  const te=S.carcere>0?0:(S.lavoro&&!JOB[S.lavoro.id].pt?.5:1);
  const cap=Math.round(T0.cap*(A.dip+te));
  const clienti=Math.min(domanda,cap);
  const ricavi=Math.round(clienti*T0.scontrino*Pr.k*ip());
  const materie=Math.round(ricavi*(1-T0.margine));
  const personale=Math.round(A.dip*T0.stip*1.35*ip());
  const affitti=Math.round(A.sedi*T0.affitto*ip());
  const qual=Math.round(ricavi*Q.costo);
  const mkt=Math.round(M.v*ip());
  const lordo=ricavi-materie-personale-affitti-qual-mkt-A.compenso;
  const tasse=lordo>0?Math.round(lordo*.27):0;
  return {domanda,cap,clienti,ricavi,materie,personale,affitti,qual,mkt,compenso:A.compenso,tasse,utile:lordo-tasse};
}
function annoAzienda(){
  const A=S.azienda;const c=calcolaAzienda(A,false);
  A.cassa+=c.utile;A.ultimo=c;A.anni++;
  A.rep=clamp(A.rep+QUALITA_AZ[A.qualita].rep+(c.domanda>c.cap*1.15?-6:0)+(A.prezzo==='basso'?1:A.prezzo==='alto'?-1:0)+r(-3,3));
  if(A.cassa<-A.investito*.6&&!coda.some(q=>q.e===EV.fallimento))coda.push({e:EV.fallimento,d:{}});
  return A.compenso?netto(A.compenso):0;
}
function valoreAzienda(A){if(!A)return 0;const T0=AZ(A.id);return Math.max(0,Math.round((A.ultimo?Math.max(0,A.ultimo.utile):0)*T0.mult+A.cassa+A.sedi*T0.aprire*ip()*.5))}

/* Tetto dei follower: dipende da quanto sei bravo a farti seguire (aspetto, arte, tecnologia, fama). Il massimo assoluto è 40 milioni. */
const CAP_FOLLOWER=40e6;
function tettoFollower(){const q=(S.aspetto+S.abil.arte+S.abil.tech)/300+S.fama/250;return Math.round(CAP_FOLLOWER*Math.pow(Math.max(.15,Math.min(1,q)),3))}
const crescita=(f,n)=>Math.round(n*Math.max(0,1-f/tettoFollower()));
function famaDaFollower(f){return f<1000?0:clamp(15*Math.log10(f)-40)}
function famaDaLavoro(){const L=S.lavoro;if(!L)return 0;if(L.id==='att')return [5,15,30,50,80][L.liv];if(L.id==='mus')return [2,10,30,70][L.liv];if(L.id==='calc')return [10,20,45,75][L.liv];return 0}

    if(so.comprati&&chance(.2)){so.follower=Math.round(so.follower*.5);so.comprati=0;log('Il social scopre i tuoi follower falsi e te ne cancella metà.','b')}
  }

}
function pubblica(id){
  const so=S.social;const k='post_'+id;
  if(S.azioni[k])return [attesa(k)+'.','x'];segnaAz(k);S.fatti.postati=(S.fatti.postati||0)+1;
  const q={a:S.aspetto,v:(S.abil.arte+S.abil.tech)/2+20,k:(S.karma+S.felicita)/2,o:50}[POST.find(p=>p.id===id).sk]/100;
  let n=Math.round((30+so.follower*.03)*(.4+q*1.6)*r(50,150)/100*(1+S.fama/60));
  if(id==='opinione'&&chance(.35)){const x=Math.round(so.follower*r(10,25)/100);so.follower=Math.max(0,so.follower-x);mod('felicita',-6);if(chance(.3)){const ne=creaNemico('social');if(ne)log(`${ne.nome} ti ha preso di mira dopo il tuo post.`,'b')}return [`Shitstorm! Il tuo post fa infuriare mezzo internet. Perdi ${nf(x)} follower.`,'b']}

  so.follower+=n;mod('felicita',r(1,3));
  return [`${pick(['Un sacco di like.','Qualche commento carino.','Il post va bene.','I tuoi amici condividono.'])} +${nf(n)} follower.`,'g'];
}
const nf=n=>new Intl.NumberFormat('it-IT').format(Math.round(n));

/* ---------- Crimine ---------- */
function commettiCrimine(id){
  const C=CRIMINI.find(x=>x.id===id),k='crim_'+id;
  if(S.azioni[k])return ['Meglio non tentare la fortuna due volte di fila: '+attesa(k).toLowerCase()+'.','x'];if(S.bis.energia<14)return [stanco(),'x'];S.bis.energia=clamp(S.bis.energia-10);segnaAz(k);
  let p=C.p+S.crim.exp/150+(S.intelligenza-50)/400+(C.sk?(S.abil[C.sk]-30)/200:0);p=Math.max(.05,Math.min(.92,p));
  S.karma=clamp(S.karma+C.k);
  if(chance(p)){
    const b=P(r(C.b[0],C.b[1]));soldi(b);S.crim.exp+=C.exp;S.crim.colpi++;if(C.f)mod('felicita',C.f);
    if(chance(.08))futuro(r(1,3),'indagine',{x:C.reato});

function avvicinaClan(){

function umoreFrase(){

/* ---------- Salute mensile ----------

const PESO_CRON={'Cardiopatia ischemica':6,'Ipertensione':2,'Artrosi':3,'Asma':3,'Emicrania cronica':3,'Diabete di tipo 2':5,'BPCO':7,'Demenza':8};

function incidenzaTumore(e,ses){

  p*=ses==='M'?1.15:(e<55?1.4:.65);

}
function tumorePer(ses,e,fuma){

function avviaCura(m,privata){m.cura={fine:S.t+(privata?r(4,9):r(6,12)),p:probRemissione(m,privata)};m.linee=(m.linee||0)+1}

function meseSalute(){

  S.malattie=S.malattie.filter(m=>{
    if(m.tum||TUMORE[m.n]){
      m.tum=1;

    return true;
  });

  // malattie lievi: i bambini piccoli due all'anno, gli adulti una ogni due anni
  if(e>=1&&chance((e<6?2:e<13?1:e<65?.5:.6)/12*inv)){
    if(e<12&&!S.fatti.varicella&&chance(.3)){S.fatti.varicella=1;ammala('Varicella',1)}

  const cron=[['Ipertensione',e<40?.002:e<55?.012:e<70?.025:.03],['Diabete di tipo 2',(e<40?.0005:e<60?.004:e<75?.008:.01)*(B.forma<35?1.6:1)],['Artrosi',e<50?0:.012],['Asma',.0008],['Emicrania cronica',e>=15&&e<=50?(S.sesso==='F'?.004:.0015):0],['BPCO',S.dip.fumo&&e>=45?.006:0]];

function morteMese(){

/* La causa di morte: una delle malattie, in proporzione al suo rischio, oppure una causa tipica dell'età */

function inclinazione(c){

/* ---------- Tempo passato con le persone ---------- */
function contatti(){
  const amiciH=rOre('amici')+rOre('uscite')*.3,famH=rOre('famiglia'),parH=rOre('partner'),figH=rOre('figli');
  const am=vivi(['Amico']).filter(p=>!p.cella);
  if(amiciH>0&&am.length){
    const fr=am.filter(p=>p.frequente);
    const base=(fr.length?fr:[...am].sort((a,b)=>b.rapporto-a.rapporto));
    const n=Math.max(1,Math.min(base.length,Math.round(amiciH/2.5),5));
    const sel=base.slice(0,n),h=amiciH/n;
    for(const p of sel){p.rapporto=clamp(p.rapporto+Math.min(7,h*1.1)*(p.lontano?.45:1)*(.7+affinita(p)/170));p.ultimo=S.t}
  }
  const fam=S.relazioni.filter(p=>p.vivo&&['Madre','Padre','Patrigno','Fratello','Nonno'].includes(p.ruolo));
  const aCasa=S.casa.tipo==='genitori';
  for(const p of fam){
    let h=famH/Math.max(1,fam.length)*(p.ruolo==='Nonno'?.7:1)+(aCasa&&p.ruolo!=='Nonno'&&!p.fuori?2.5:0);
    if(h>0){p.rapporto=clamp(p.rapporto+Math.min(5,h*.7)*(p.lontano?.5:1));p.ultimo=S.t}
  }
  const zii=vivi(['Zio','Cugino']);if(famH>=6&&zii.length&&chance(.2)){const z=pick(zii);z.rapporto=clamp(z.rapporto+3);z.ultimo=S.t}
  const fig=vivi(['Figlio']).filter(p=>!p.fuori||p.eta>=18);
  if(fig.length){
    const h=figH/Math.max(1,fig.filter(p=>p.eta<18).length);
    for(const p of fig){
      if(p.eta<18){p.rapporto=clamp(p.rapporto+Math.min(5,h*.35)-(h<3?2:0));if(p.eta>=6&&h>=4)p.voto=clamp((p.voto||50)+.4);p.ultimo=S.t}
      else if(famH>0){p.rapporto=clamp(p.rapporto+Math.min(4,famH/fam.length*.6||1));p.ultimo=S.t}
    }
  }
  const pa=partnerAttuale();
  if(pa){pa.oreMese=parH+(convivente()?5:0);pa.ultimo=S.t}
}

/* ---------- La coppia: intimità, passione, impegno ---------- */
function mesePartner(p){
  const h=p.oreMese||0,anni=(S.t-(p.dal||S.t))/12;
  const att=S.att||'sicuro';
  p.intim=clamp(p.intim+Math.min(6,h*.3)-1+(affinita(p)-50)*.03);
  p.pass=clamp(p.pass+(28+Math.min(40,h*3.2)-p.pass)*.06-Math.min(1.2,anni*.04)+(S.bis&&S.bis.energia>55?.3:-.3));
  p.imp=clamp(p.imp+(p.conv?.5:.2)+(p.ruolo==='Coniuge'?.3:0)-(att==='evitante'?.6:0)-(att==='timoroso'?.4:0));
  let conflitto=(100-p.pers.A)*.03+(100-S.pers.A)*.025+(p.pers.N-50)*.03+(S.bis?S.bis.stress-40:0)*.04+(S.soldi<0?1.5:0)+(att==='ansioso'?1.2:0)+(att==='timoroso'?1:0)-(affinita(p)-50)*.05;
  conflitto=Math.max(0,conflitto);
  const prima=p.rapporto;
  const base=clamp(p.intim*.45+p.pass*.25+p.imp*.3-conflitto*2.2);
  p.rapporto=clamp(p.rapporto+(base-p.rapporto)*.3);
  if(conflitto>4.5&&chance(.12)&&!coda.length)coda.push({e:EV.lite_coppia,d:{p}});
  else if(h<3&&prima>40&&chance(.08)&&!coda.length)coda.push({e:EV.trascurato,d:{p}});
  if(p.ruolo==='Partner'&&!p.conv&&anni>=1.5&&p.rapporto>=65&&p.imp>=60&&chance(.03)&&S.eta>=19&&!coda.length&&S.carcere===0)coda.push({e:EV.proposta_conv,d:{p}});
  if(p.ruolo==='Partner'&&p.conv&&anni>=2&&p.rapporto>=70&&p.imp>=70&&chance(.025)&&!coda.length)coda.push({e:EV.proposta_nozze,d:{p}});
  if(p.ruolo==='Partner'&&p.rapporto<18&&chance(.25)){p.ruolo='Ex';p.conv=false;mod('felicita',-12);pesa(Math.round(8+prima/8),5);ricorda(p,'Vi siete lasciati');log(`${p.nome} ti lascia: «Non funziona più tra noi».`,'b');if(S.att==='ansioso')segnaVita('divorzio')}
  if(p.ruolo==='Coniuge'&&(p.rapporto<12&&chance(.05)||chance(.0011*(1+pz('N')*.5)*(1+ppz(p,'N')*.5)*(1.5-affinita(p)/100)))&&!coda.some(q=>q.e.id==='div_richiesta'))coda.push({e:EV.div_richiesta,d:{p}});
}

/* ---------- Mese per ogni persona ---------- */
function meseNpc(){
  meseGenitori();
  const lista=S.relazioni.filter(p=>p.vivo);
  for(const p of lista){
    if(!p.pers){p.pers=persDaTr(p.tr);initNpc(p)}
    if(S.mese===p.mn){p.eta++;compleannoNpc(p)}
    if(!p.vivo)continue;
    const q=morteP(p.eta,p.malato===3?30:p.malato===2?55:72,p.sesso);
    if(p.eta>=30&&chance(1-Math.pow(1-q,1/12))){mortePersona(p);continue}
    // decadimento dei rapporti
    if(S.casa.tipo==='genitori'&&['Madre','Padre','Patrigno','Fratello'].includes(p.ruolo)&&!p.fuori&&!(p.ruolo==='Padre'&&S.fatti.genitoriSeparati&&chance(.5)))p.ultimo=S.t;
    if(S.eta<6&&['Madre','Padre','Patrigno'].includes(p.ruolo)&&chance(.5))relD(p,1);   // prima +0,5 veniva arrotondato a +1: si tiene il calore effettivo di sempre
    const non=S.t-(p.ultimo||0);
    // cali con passo(): prima clamp() arrotondava e i cali sotto 0,5 (zii, cugini, figli adulti) non avvenivano mai
    if(p.ruolo==='Amico')relD(p,-(non>=2?1.6:.6)*(p.lontano?1.3:1));
    else if(['Zio','Cugino','Suocero','Cognato'].includes(p.ruolo))relD(p,-(non>=6?.5:non>=3?.2:0));
    else if(['Madre','Padre','Fratello','Nonno','Patrigno'].includes(p.ruolo))relD(p,-(non>=3?.6:0));
    else if(p.ruolo==='Figlio'&&p.eta>=18)relD(p,-(non>=4?.5:0));
    else if(p.ruolo==='Conoscente')relD(p,-1.5);
    // un rapporto perfetto si consuma un po' anche frequentandosi: al 100% si resta solo con cura costante
    if(p.rapporto>=95&&S.eta>=14&&!['Partner','Coniuge'].includes(p.ruolo))relD(p,-.35);
    if(['Partner','Coniuge'].includes(p.ruolo))mesePartner(p);
    p.umore=clamp(p.umore+(60+ppz(p,'E')*8-ppz(p,'N')*15-p.umore)*.2+r(-4,4));
    vitaNpc(p);
    // chi ti cerca
    if(['Amico','Fratello','Madre','Padre','Nonno','Cugino','Figlio'].includes(p.ruolo)&&p.rapporto>=35&&chance(.012+p.pers.E*.0004)){
      p.rapporto=clamp(p.rapporto+2);p.ultimo=S.t;
      const ct=chance(.2)&&cercaTesto(p);if(ct)log(`${p.nome} ${ct}.`,'h');
    }

    if(!p.vivo)continue;
    if(p.ruolo==='Amico'&&p.rapporto<8&&!p.cella){p.rimuovi=true;log(`Tu e ${p.nome} vi siete persi di vista.`,'h')}

  }
  const ex=S.relazioni.filter(p=>p.ruolo==='Ex');
  if(ex.length>4)ex.slice(0,ex.length-4).forEach(p=>p.rimuovi=true);
  S.relazioni=S.relazioni.filter(p=>!p.rimuovi);

    if(vicino(p)&&!richiesta('r_matrimonio',p))annuncia(p,`${cap(tuoR(p))} ${p.nome} ${coppiaStessoSesso(p)?'celebra l\'unione civile con':'si sposa con'} ${p.pNome||'la persona che ama'}.`,'g');
    if(p.ruolo==='Fratello'&&!S.relazioni.some(x=>x.famDi===p.id))nuovaPersona('Cognato',p.pSesso||(p.sesso==='M'?'F':'M'),p.eta+r(-3,3),null,{rapporto:r(40,70),famDi:p.id,nome:p.pNome||undefined})}
  else if(['coppia','sposato'].includes(p.coppia)&&chance(.003*(1+(A.N-50)/60-(A.A-50)/80))){const sp=p.coppia==='sposato';p.coppia='separato';p.umore=clamp(p.umore-25);
    if(!(p.rapporto>=55&&chance(.4)&&richiesta('r_separazione',p)))annuncia(p,`${cap(tuoR(p))} ${p.nome} si ${sp?'separa':'lascia'} ${partnerDi(p,sp)}.`,'b')}
  if(['sposato','coppia'].includes(p.coppia)&&!coppiaStessoSesso(p)&&e<44&&(p.figliN||0)<4&&chance(p.coppia==='sposato'?.009:S.t-(p.dalC||0)>=18?.006:0)){p.figliN=(p.figliN||0)+1;
    if(['Fratello'].includes(p.ruolo)){annuncia(p,`${p.nome} ha avuto ${pick(['un bambino','una bambina'])}: sei diventat${g('o','a')} zi${g('o','a')}!`,'g');mod('felicita',4)}
    else annuncia(p,`${p.nome} ha avuto ${pick(['un bambino','una bambina'])}.`,'g')}
  // trasloco
  if(!p.lontano&&e>=20&&e<50&&['Amico','Fratello','Cugino','Figlio'].includes(p.ruolo)&&chance(.0018)){p.lontano=true;
    const dove=pick(['Milano','Londra','Berlino','Bologna','Roma','Torino','Barcellona','Parigi','Amsterdam','Dublino'].filter(x=>x!==S.citta));p.dove=dove;
    if(!(p.rapporto>=60&&richiesta('r_trasloco',p)))annuncia(p,`${p.nome} si trasferisce a ${dove}.`,'h')}
  // momenti difficili e richieste
  if(p.rapporto>=45&&p.umore<30&&chance(.04))richiesta('r_sfogo',p);
  if(p.stato==='disoccupato'&&p.rapporto>=50&&A.C<50&&chance(.015))richiesta('r_prestito',p);
  if(p.prestito>0&&chance(.04+A.C*.0012)){const x=p.prestito;p.prestito=0;soldi(x);p.rapporto=clamp(p.rapporto+3);log(`${p.nome} ti restituisce i ${eur(x)} che ${gp(p,'gli','le')} avevi prestato.`,'g')}
  if(['Amico','Cugino','Fratello','Cognato'].includes(p.ruolo)&&p.rapporto>=30&&p.rapporto<70&&chance(.006*(1+(50-A.A)/40)*(1+(50-S.pers.A)/60)))richiesta('r_lite',p);
  if(p.ruolo==='Amico'&&p.rapporto>=55&&chance(.01*(.6+A.E/100)))richiesta('r_invito',p);
  if(p.ruolo==='Amico'&&S.t-(p.ultimo||0)>=6&&p.rapporto>=40&&chance(.08))richiesta('r_sparito',p);
}

  if(S.lavoro)ctx.push(['lavoro',3]);if(iscritto()&&S.scuola.stato!=='asilo')ctx.push(['scuola',4]);

}

function orePartnerAuto(){

/* ================= ASPETTO: il volto stilizzato che invecchia con te =================
   S.look e p.look = {pelle, capelli, taglio, occhi, maglia, barba} (indici nelle tavolozze; taglio e barba sono id).
   Attenzione: S.aspetto è la statistica (bellezza 0–100), il volto è S.look. */
const PELLE=['#F7DAC4','#EEC5A2','#DBA67E','#BE8157','#915C3B','#61402B'];
const CAPELLI=[['Neri','#241C18'],['Castano scuro','#4C3123'],['Castani','#7B5132'],['Ramati','#A8552D'],['Biondi','#D9B46F'],['Biondo cenere','#BCA78B']];
const OCCHI=[['Marroni','#5B3A22'],['Nocciola','#8B6A2E'],['Verdi','#4E7A4A'],['Azzurri','#4A84B8'],['Grigi','#7C8B97']];
const TAGLI=[['corti','Corti'],['rasati','Rasati'],['mossi','Mossi'],['caschetto','Caschetto'],['lunghi','Lunghi'],['raccolti','Raccolti'],['ricci','Ricci']];
const BARBE=[['no','Niente'],['corta','Barba'],['baffi','Baffi']];
const MAGLIE=['#2244D6','#21894F','#C98400','#C2386A','#C23B25','#6B4FC8','#1B8A8A','#3A4654'];

const pesaIdx=w=>{let t=w.reduce((a,b)=>a+b,0),x=Math.random()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return 0};
function lookCasuale(sesso){
  return {pelle:pesaIdx([3,4,3,1.4,.9,.6]),capelli:pesaIdx([20,35,25,4,10,6]),occhi:pesaIdx([55,15,12,12,6]),
    taglio:sesso==='F'?pick(['lunghi','lunghi','caschetto','raccolti','ricci','mossi','corti']):pick(['corti','corti','rasati','mossi','ricci']),
    barba:sesso==='M'?pick(['no','no','no','corta','corta','baffi']):'no',maglia:r(0,MAGLIE.length-1)};
}
/* Genetica semplice: si somiglia ai genitori, con qualche sorpresa */
function lookFiglio(m,p,sesso){
  m=m||lookCasuale('F');p=p||lookCasuale('M');
  const occhi=(m.occhi===0||p.occhi===0)&&chance(.65)?0:chance(.9)?pick([m.occhi,p.occhi]):r(0,OCCHI.length-1);
  return {pelle:Math.max(0,Math.min(PELLE.length-1,Math.round((m.pelle+p.pelle)/2+(chance(.3)?pick([-1,1]):0)))),
    capelli:chance(.85)?pick([m.capelli,p.capelli]):r(0,CAPELLI.length-1),occhi,
    taglio:lookCasuale(sesso).taglio,barba:'no',maglia:r(0,MAGLIE.length-1)};
}
/* Chi non ha ancora un volto (salvataggi vecchi, persone nate in gioco) lo riceve qui */
function lookDi(p){
  if(!p)return lookCasuale('M');
  if(p===S){if(!S.look)S.look=lookCasuale(S.sesso);return S.look}
  if(!p.look){
    if(['Figlio','Nipote'].includes(p.ruolo)){const pa=S.relazioni.find(x=>['Coniuge','Ex','Partner'].includes(x.ruolo));p.look=lookFiglio(lookDi(S),pa&&lookDi(pa),p.sesso)}
    else p.look=lookCasuale(p.sesso);
  }
  return p.look;
}

function mixHex(a,b,t){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const coloreCapelli=(L,eta)=>{const c=CAPELLI[L.capelli][1];if(eta<42)return c;if(eta>=78)return '#E2DFDA';return mixHex(c,'#B7B4B0',Math.min(.9,(eta-42)/30))};

/* Il volto: viewBox 100×120. Fasi: neonato (<2), bambino (<13), ragazzo (<18), adulto, anziano (rughe da 55, capelli bianchi verso gli 80) */

  }

  const T=bimbo?'translate(50 56) scale(1.1) translate(-50 -53)':eta<18?'translate(50 54) scale(1.04) translate(-50 -53)':'';
  // capelli dietro la testa

    mossi:`<path d="M23 56c-5-26 13-39 29-38 18 0 32 14 25 38-3-10-5-14-11-18-8 4-22 4-30 0-6 4-10 10-13 18z"/>`,
    caschetto:`<path d="M27 46c0-18 13-24 23-24 12 0 23 6 23 24-7-8-15-10-23-9-8-1-16 1-23 9z"/>`,
    lunghi:`<path d="M26 50c-1-22 14-29 26-29 12 0 23 8 22 27-8-14-24-18-34-12-7 4-11 8-14 14z"/>`,
    raccolti:`<path d="M26 48c0-20 13-26 24-26s24 6 24 26c-6-9-15-12-24-12s-18 3-24 12z"/>`,
    ricci:`<g><circle cx="30" cy="40" r="9"/><circle cx="36" cy="30" r="10"/><circle cx="47" cy="24" r="11"/><circle cx="59" cy="25" r="10"/><circle cx="69" cy="32" r="10"/><circle cx="72" cy="43" r="8"/><circle cx="27" cy="50" r="6"/><circle cx="74" cy="51" r="6"/></g>`}[L.taglio]||'';
  // capelli dietro: prima del collo e delle spalle (i capelli lunghi cadono dietro, non coprono il collo)
  s+=`<g transform="${T}"><g fill="${cap}">${dietro}</g></g>`;
  // corpo
  s+=bimbo?`<path d="M20 120c0-18 13-27 30-27s30 9 30 27z" fill="${ma}"/>`:`<path d="M14 120c0-22 16-32 36-32s36 10 36 32z" fill="${ma}"/>`;
  s+=`<rect x="43" y="72" width="14" height="${bimbo?24:20}" rx="6" fill="${pelle}"/>`;

  // occhi

  if(!bimbo)s+=`<path d="M36 47.5q5-2.5 10 0M54 47.5q5-2.5 10 0" fill="none" stroke="${cap}" stroke-width="2.2" stroke-linecap="round"/>`;

  if(eta>=68)s+=`<path d="M42 37q8-2.5 16 0M44 41q6-1.5 12 0" fill="none" stroke="${ombra}" stroke-width="1.3" stroke-linecap="round"/>`;
  const barba=adulto&&sesso==='M'?L.barba:'no';

  s+=`<g fill="${cap}">${davanti}</g>`;

/* ================= FAMIGLIA: fertilità, gravidanza, adozione, separazione =================
   Numeri da ANALISI.md: concepimento per ciclo ≈ 25% sotto i 30 anni, 20% dopo, 5% a 40, 1% dopo i 45;
   aborto spontaneo 10–20% delle gravidanze riconosciute (oltre il 50% dopo i 45); gemelli 1,4% dei parti; cesareo 3 su 10. */

/* Probabilità di concepire in un mese di tentativi, secondo l'età della donna (e un po' quella dell'uomo) */
function fertilitaMese(etaDonna,etaUomo){
  const e=etaDonna;
  let p=e<18?.15:e<30?.25:e<35?.2:e<38?.15:e<40?.11:e<43?.06:e<45?.025:e<48?.01:0;
  if(etaUomo>45)p*=.85;
  return p;
}
const rischioAborto=e=>e<20?.15:e<30?.1:e<35?.12:e<40?.18:e<45?.33:.53;
/* Procreazione assistita: successo per ciclo, indicativo (legge 40/2004: solo coppie di sesso diverso, sposate o conviventi) */
const successoPMA=e=>e<35?.3:e<38?.24:e<40?.17:e<43?.1:e<46?.03:0;
/* Chi può restare incinta nella coppia: ritorna {eta della donna, eta dell'uomo} o null */
function coppiaFertile(p){
  if(!p||S.sesso===p.sesso)return null;
  return S.sesso==='F'?{donna:S.eta,uomo:p.eta}:{donna:p.eta,uomo:S.eta};
}
const inGravidanza=()=>!!S.gravidanza;

function iniziaTentativi(p){S.provano={pid:p.id,t0:S.t};return ['Decidete di provarci. Adesso è una questione di tempo, e un po\' di fortuna.','g']}
function concepisci(p,pma){
  const c=coppiaFertile(p);if(!c)return;
  S.provano=null;
  const gem=chance(pma?.066:c.donna>=35?.02:.012);
  S.gravidanza={pid:p.id,t0:S.t,parto:S.t+9,gem,ses:pick(['M','F']),madreEta:c.donna,tu:S.sesso==='F'};
  mod('felicita',10);p.rapporto=clamp(p.rapporto+5);
  log(S.sesso==='F'?'Il test è positivo: aspetti un bambino!':`${p.nome} ti mostra il test: è positivo. Aspettate un bambino!`,'g');
}
/* Ogni mese: tentativi, gravidanza, parto */
function meseFamiglia(){
  if(S.adozione&&S.t-S.adozione.t0>60)S.adozione=null;
  const G=S.gravidanza;
  if(G){
    const p=S.relazioni.find(x=>x.id===G.pid);
    const m=S.t-G.t0;
    if(m>=2&&!G.ok){
      G.ok=1;
      if(chance(rischioAborto(G.madreEta))){
        S.gravidanza=null;mod('felicita',-12);pesa(14,6);if(p&&p.vivo)p.rapporto=clamp(p.rapporto+3);
        log(G.tu?'Al secondo mese perdi il bambino. Un dolore di cui si parla poco, e che pesa tanto.':`Al secondo mese ${p?p.nome:'la tua compagna'} perde il bambino. Un dolore di cui si parla poco, e che pesa tanto.`,'b');
        if(p&&p.vivo&&p.conv)S.provano={pid:p.id,t0:S.t};
        return;
      }
    }
    if(m===4&&!G.eco){G.eco=1;log(`Ecografia: ${G.gem?'sono due!':G.ses==='F'?'sarà una femmina.':'sarà un maschio.'}`,'g')}
    if(S.t>=G.parto){
      S.gravidanza=null;
      const ces=chance(.3),n=G.gem?2:1,nati=[];
      for(let i=0;i<n;i++)nati.push(nasceFiglio(p,i?pick(['M','F']):G.ses,true));
      const nomi=nati.map(f=>f.nome).join(' e ');
      log(`${n===2?`Sono nati due gemelli: ${nomi}!`:`È nat${gp(nati[0],'o','a')} ${nomi}!`}${ces?' Parto cesareo, ma state tutti bene.':''}`,'g');
      if(p&&p.vivo&&!['Partner','Coniuge'].includes(p.ruolo))nati.forEach(f=>{if(!G.tu)f.conEx=true});
      if(S.lavoro&&!JOB[S.lavoro.id].pt){
        if(G.tu){S.fatti.congedo=S.t+5;log('Inizi il congedo di maternità: 5 mesi all\'80% dello stipendio.','h')}
        else log('Prendi i 10 giorni di congedo di paternità. Notti in bianco garantite.','h');
      }
    }
    return;
  }
  if(S.provano){
    const p=S.relazioni.find(x=>x.id===S.provano.pid);
    const c=p&&p.vivo&&(p.ruolo==='Coniuge'||(p.ruolo==='Partner'&&p.conv))?coppiaFertile(p):null;
    if(!c){S.provano=null;return}
    if(chance(fertilitaMese(c.donna,c.uomo)))return concepisci(p);
    const da=S.t-S.provano.t0;
    if(da===12)log('È un anno che ci provate. Il medico vi parla di esami e di procreazione assistita.','h');
    if(da>=48){S.provano=null;log('Dopo quattro anni smettete di provarci. Ognuno lo vive a modo suo.','h');pesa(6,3)}
  }
}

/* ---------- Adozione (legge 184/1983): coniugi sposati da almeno 3 anni, differenza d'età tra 18 e 45 anni (fino a 55 per uno dei due) ---------- */
function puoAdottare(p){
  if(!p||p.ruolo!=='Coniuge'||!p.vivo||S.sesso===p.sesso)return 'Possono adottare solo i coniugi sposati (di sesso diverso)';
  if(S.adozione)return 'C\'è già una domanda in corso';
  if(S.t-(p.nozze!==undefined?p.nozze:-999)<36)return 'Servono almeno 3 anni di matrimonio';
  if(Math.min(S.eta,p.eta)>55)return 'La differenza d\'età con il bambino sarebbe troppa';
  return '';
}
function avviaAdozione(p){
  const no=puoAdottare(p);if(no)return [no+'.','x'];

/* ---------- Separazione e divorzio ----------
   Prima la separazione (si vive divisi subito), poi il divorzio: dopo 6 mesi se consensuale, 12 se giudiziale (legge 55/2015).
   Comunione dei beni (il regime di partenza per legge): metà di quanto risparmiato durante il matrimonio va all'altro. */
function divorzia(p){
  const giud=(p.rancore||0)>50||chance(.2);
  const avv=P(giud?r(6000,15000):r(1500,3000));
  const base=p.soldiNozze!==undefined?p.soldiNozze:Math.round(S.soldi*.2);
  const quota=Math.max(0,Math.round((S.soldi-avv-base)*.5));
  soldi(-avv-quota);
  p.ruolo='Ex';p.conv=false;p.exConiuge=true;mod('felicita',-12);segnaVita('divorzio');pesa(16,6);rimuoviSuoceri(p);if(chance(.3))p.rancore=r(40,70);
  S.fatti.separazione={pid:p.id,fino:S.t+(giud?12:6)};
  futuro(giud?1:.5,'divorzio_definitivo',{p});
  const minori=vivi(['Figlio']).filter(f=>f.eta<18&&!f.conEx);
  minori.forEach(f=>f.rapporto=clamp(f.rapporto-10));
  if(minori.length)coda.unshift({e:EV.affido,d:{p}});
  return [`Tu e ${p.nome} vi separate${giud?' davanti al giudice':' di comune accordo'}. Avvocati: ${eur(avv)}${quota?`; con la divisione dei risparmi del matrimonio vanno a ${p.nome} altri ${eur(quota)}`:''}. Il divorzio arriverà tra ${giud?'un anno':'sei mesi'}.`,'b'];
}

/* L'assegno di mantenimento per i figli (circa 250 € al mese per figlio, indicativo) finché non hanno 21 anni */
function mantenimento(pid,figli,segno){S.mantenimento=(S.mantenimento||[]).filter(m=>m.pid!==pid);S.mantenimento.push({pid,figli:figli.map(f=>f.id),segno,annuo:3000})}
function voceMantenimento(add){

  S.mantenimento=S.mantenimento.filter(m=>m.figli.some(id=>{const f=S.relazioni.find(x=>x.id===id);return f&&f.vivo&&f.eta<21}));
  for(const m of S.mantenimento){const n=m.figli.filter(id=>{const f=S.relazioni.find(x=>x.id===id);return f&&f.vivo&&f.eta<21}).length;
    if(n)add(m.segno>0?`Mantenimento ricevuto per i figli (${n})`:`Mantenimento versato per i figli (${n})`,m.segno*P(m.annuo)*n)}
}

/* ---------- Lavoro: mesi lavorati, TFR, NASpI ---------- */
/* Ogni mese: storico degli ultimi 48 mesi (per la NASpI), TFR che matura, montante dei contributi (per la pensione) */
function meseItalia(){
  S.lav48=(S.lav48||[]).concat(S.lavoro?1:0).slice(-48);
  const L=S.lavoro;
  if(L){L.tfr=(L.tfr||0)+L.stip/13.5/12;S.montante=(S.montante||0)+L.stip*.33/12}
  if(S.azienda&&S.azienda.compenso)S.montante=(S.montante||0)+S.azienda.compenso*.24/12;
  if(S.naspi){S.naspi.m++;if(S.naspi.m>S.naspi.mesi||S.lavoro){if(!S.lavoro)log('Finisce la NASpI.','h');S.naspi=null}}
  if(S.sfl){S.sfl.m++;if(S.sfl.m>S.sfl.mesi||S.lavoro){if(!S.lavoro)log('Finisce il corso, e con lui il Supporto formazione e lavoro.','h');S.sfl=null}}
  if(S.fatti.congedo&&S.fatti.congedo===S.t){S.fatti.congedo=0;log('Finisce il congedo di maternità: si torna al lavoro.','h')}
}
/* La liquidazione (TFR) quando un lavoro finisce, per qualsiasi motivo */
function pagaTFR(){
  const L=S.lavoro;if(!L||!L.tfr)return;
  const x=Math.round(L.tfr*.77);L.tfr=0;if(x<50)return;
  soldi(x);log(`Ricevi il TFR, la liquidazione: ${eur(x)} netti.`,'g');
}
/* NASpI: a chi perde il lavoro senza averlo lasciato. Il 75% dello stipendio (con un tetto), per metà dei mesi lavorati negli ultimi 4 anni */
function avviaNaspi(L){
  const n=(S.lav48||[]).reduce((s,x)=>s+x,0);
  if(n<3||!L)return;
  const lordo=L.stip/12,soglia=P(1460),cap=P(1585);
  const imp=Math.min(cap,lordo<=soglia?lordo*.75:soglia*.75+(lordo-soglia)*.25);
  S.naspi={mesi:Math.min(24,Math.floor(n/2)),imp:Math.round(imp*.88),m:0,over55:S.eta>=55};
  log(`Fai domanda di NASpI: circa ${eur(S.naspi.imp)} netti al mese per ${S.naspi.mesi} mesi (dal sesto mese cala del 3% ogni mese).`,'h');
}
const naspiMese=()=>S.naspi?Math.round(S.naspi.imp*Math.pow(.97,Math.max(0,S.naspi.m-(S.naspi.over55?7:5)))):0;

/* ---------- Pensioni (sistema contributivo, chi nasce dal 2000) ----------
   Vecchiaia a 67 anni con 20 di contributi; anticipata con 42 anni e 10 mesi (41 e 10 le donne) a qualsiasi età;
   a 71 anni bastano 5 anni. Importo = montante × coefficiente di trasformazione (biennio 2025–2026). */
const COEFF_TRASF={57:4.204,58:4.308,59:4.419,60:4.536,61:4.661,62:4.795,63:4.936,64:5.088,65:5.250,66:5.423,67:5.608,68:5.808,69:6.024,70:6.258,71:6.510};
function pensioneMaturata(){
  const c=S.contributi||0,e=S.eta;
  if(e>=S.mondo.pensEta&&c>=20)return 'vecchiaia';
  if(c>=(S.sesso==='F'?41.83:42.83))return 'anticipata';
  if(e>=S.mondo.pensEta+4&&c>=5)return 'vecchiaia';
  return '';
}
function nettoPensione(l){if(l<=0)return 0;const t=Math.max(0,irpef(l)-detrazione(l))+l*.02;return Math.round(l-t)}
function pensioneCalcolata(){
  const k=COEFF_TRASF[Math.max(57,Math.min(71,S.eta))]/100;
  return nettoPensione((S.montante||0)*k);
}
function vaiInPensione(auto){
  const tipo=pensioneMaturata();
  pagaTFR();
  if(S.lavoro){S.storico.push(S.lavoro.nome);S.lavoro=null}
  S.pensione=Math.max(1,pensioneCalcolata());S.fatti.pensioneTipo=tipo;
  log(`${auto?'Arriva la pensione':'Vai in pensione'} (${tipo==='anticipata'?'anticipata':'di vecchiaia'}, ${Math.round(S.contributi)} anni di contributi): ${eur(S.pensione/13)} netti al mese per 13 mensilità.`,'g');
}
/* Assegno sociale: dai 67 anni a chi ha redditi bassi (7.101 € l'anno nel 2026) */
const ASSEGNO_SOCIALE=7101;
/* La pensione di una persona del gioco (per la reversibilità e per pagare la badante o la RSA) */
function pensioneNpc(p){
  if(p.pensioneNpc)return p.pensioneNpc;
  const j=JOB[p.lavoro]||null;
  let l=j?stipLiv(j,1)*.6:0;
  if(!j&&p.stato==='casa')l=0;
  p.pensioneNpc=Math.max(P(ASSEGNO_SOCIALE),nettoPensione(l));
  return p.pensioneNpc;
}
/* Reversibilità: il 60% della pensione del coniuge, ridotta se hai già redditi alti */
function avviaReversibilita(p){
  if(p.eta<40&&p.stato!=='pensione')return;
  const mio=(S.lavoro?S.lavoro.stip:0)+(S.pensione||0),min=P(7800);
  const rid=mio>5*min?.5:mio>4*min?.6:mio>3*min?.75:1;
  S.reversibilita=Math.round(pensioneNpc(p)*.6*rid);
  log(`Ti spetta la pensione di reversibilità di ${p.nome}: ${eur(S.reversibilita/13)} al mese.`,'h');
}

/* ---------- Sussidi ---------- */
/* Un ISEE approssimato: redditi della famiglia + 20% dei risparmi, diviso per la scala di equivalenza */
function minoriConTe(){return vivi(['Figlio']).filter(f=>f.eta<18&&!f.fuori&&!f.conEx).length}
function iseeStima(){
  const pa=partnerAttuale(),conv=pa&&pa.conv;
  const red=(S.lavoro?netto(S.lavoro.stip):0)+(S.pensione||0)+(conv?(pa.stato==='lavora'?P(20000):0):0)+(S.prop.filter(p=>p.affittata).reduce((s,p)=>s+p.valore*.045,0));
  const n=1+(conv?1:0)+minoriConTe();
  const scala=[1,1,1.57,2.04,2.46,2.85][Math.min(5,n)];
  return (red+Math.max(0,S.soldi)*.2)/scala;
}
/* ADI (dal 2024): solo famiglie con minori, over 60 o disabili. Reddito di cittadinanza (2019–2023): tutte le famiglie povere */
function sussidio(){
  if(S.eta<18||S.carcere>0||S.pensione||S.lavoro&&!JOB[S.lavoro.id].pt||S.azienda||S.crim.clan)return null;
  if(iscritto()&&S.eta<26)return null;
  const a=S.anno;if(a<2019)return null;
  const rdc=a<2024,min=minoriConTe(),pa=partnerAttuale();
  if(!rdc&&!(min>0||S.eta>=60))return null;
  if(S.eta>=S.mondo.pensEta)return null;
  if(iseeStima()>P(10140)||S.soldi>P(6000+2000*min))return null;
  const scala=1+(S.eta>=60?.4:0)+Math.min(2,min)*.15+Math.max(0,min-2)*.1+(pa&&pa.conv&&min?.4:0);
  const red=S.lavoro?netto(S.lavoro.stip):0;
  const aff=S.casa.tipo==='affitto'?Math.min(P(3360),S.casa.costo*(convivente()?.5:1)):0;
  const x=Math.max(0,P(rdc?6000:6500)*Math.min(2.2,scala)-red)+aff;
  return x>0?{n:rdc?'Reddito di cittadinanza':'Assegno di inclusione',x:Math.round(x)}:null;
}
/* SFL (da settembre 2023): 500 € al mese per 12 mesi a chi ha 18–59 anni, non ha minori né NASpI e segue un corso */
function puoSFL(){return S.anno>=2023&&S.eta>=18&&S.eta<=59&&!S.lavoro&&!S.naspi&&!S.sfl&&!iscritto()&&minoriConTe()===0&&iseeStima()<=P(10140)&&S.t-(S.fatti.sflT||-99)>=24}
/* Tutte le voci di welfare nel bilancio dell'anno (importi annui) */
function vociWelfare(add){
  if(S.naspi)add('NASpI (disoccupazione)',naspiMese()*12);
  if(S.sfl)add('Supporto formazione e lavoro',P(500)*12);
  if(S.reversibilita)add('Pensione di reversibilità',S.reversibilita);
  const su=sussidio();if(su)add(su.n,su.x);
  if(S.eta>=S.mondo.pensEta&&S.carcere===0){
    const red=(S.pensione||0)+(S.reversibilita||0)+(S.lavoro?netto(S.lavoro.stip):0)+S.prop.filter(p=>p.affittata).reduce((s,p)=>s+p.valore*.045*.79,0)+(S.azienda?netto(S.azienda.compenso||0):0);
    if(red<P(ASSEGNO_SOCIALE))add('Assegno sociale',P(ASSEGNO_SOCIALE)-red);
  }
  voceMantenimento(add);
}

/* ================= EVENTI CHE NASCONO DALLA VITA ================= */
function aggiungiOre(id,h){
  const lib=oreLibere()-oreRoutine();
  const x=h>0?Math.min(h,Math.max(0,lib)):h;
  S.routine[id]=Math.max(0,(S.routine[id]||0)+x);return x;
}
const famIn=()=>S.relazioni.filter(p=>p.vivo&&['Madre','Padre','Fratello','Nonno','Figlio','Coniuge','Partner','Patrigno'].includes(p.ruolo));
function relGruppo(L,a,b){L.forEach(p=>{p.rapporto=clamp(p.rapporto+r(a,b));p.ultimo=S.t})}

function emergenti(){
  if(S.carcere>0||S.eta<6)return;
  const B=S.bis,F=S.fatti;
  F.stressAlto=B.stress>=82?(F.stressAlto||0)+1:0;
  F.soloN=B.soc<25&&S.eta>=13?(F.soloN||0)+1:0;
  F.rossoN=S.soldi<0&&(F.ultimoMese||0)<0&&S.eta>=18?(F.rossoN||0)+1:0;
  if(coda.length)return;
  if(F.stressAlto>=3&&(S.lavoro||iscritto())&&S.t-(F.burnT||-99)>=18){F.burnT=S.t;coda.push({e:EV.burnout,d:{}});return}
  if(F.soloN>=4&&S.t-(F.soloT||-99)>=12){F.soloT=S.t;coda.push({e:EV.solitudine,d:{}});return}
  if(F.rossoN>=3&&S.t-(F.rossoT||-99)>=12){F.rossoT=S.t;coda.push({e:EV.conto_rosso,d:{}});return}
  if(S.eta>=30&&B.forma<30&&chance(.02)&&S.t-(F.medT||-99)>=24){F.medT=S.t;coda.push({e:EV.medico_forma,d:{}});return}
  if(S.eta>=9&&S.eta<17&&rOre('schermi')>=14&&iscritto()&&S.scuola.voto<48&&genitoriVivi()&&S.casa.tipo==='genitori'&&chance(.15)&&S.t-(F.consT||-99)>=12){F.consT=S.t;coda.push({e:EV.console,d:{}});return}
  if(S.lavoro&&!JOB[S.lavoro.id].pt&&soddLavoro()<38&&chance(.04)&&S.t-(F.pesaT||-99)>=18){F.pesaT=S.t;coda.push({e:EV.lavoro_pesa,d:{}});return}
  if(S.lavoro&&!JOB[S.lavoro.id].pt&&S.lavoro.perf>=70&&chance(.012+pz('C')*.008)&&S.t-(F.progT||-99)>=24){F.progT=S.t;coda.push({e:EV.capo_progetto,d:{}});return}
  if(S.sonno<6.5&&B.energia<35&&chance(.15))log('Dormi troppo poco: ti trascini per tutta la giornata.','b');
  incontri();
}

   const cura=(p,t1,t2)=>{if(!m())return ['Per fortuna era meno grave del previsto.','g'];if(chance(p)){S.malattie=S.malattie.filter(z=>z.n!==d.x);mod('salute',r(3,8));mod('felicita',6);return [t1,'g']}mod('salute',-r(2,6));return [t2,'b']};

    {l:'Inizia le cure con il Servizio sanitario',sub:'Chirurgia e terapie, gratis ma con le attese',cond:tum,_incl:0,fx:()=>{const x=m();if(!x)return ['Per fortuna era meno grave del previsto.','g'];avviaCura(x,false);S.bis.stress=clamp(S.bis.stress+10);return ['Inizi le cure: mesi di ospedale, terapie e attese. Accanto a te chi ti vuole bene.','']}},
    {l:'Curati in una clinica privata',sub:()=>eur(P(9000)),costo:()=>P(9000),cond:tum,_incl:0,fx:()=>{const x=m();if(!x)return ['Per fortuna era meno grave del previsto.','g'];avviaCura(x,true);S.bis.stress=clamp(S.bis.stress+6);return ['Medici bravissimi e tempi più rapidi. Le cure iniziano subito.','']}},
    {l:'Terapia e controlli',sub:'Farmaci e visite regolari',cond:()=>gr()===4&&!tum(),_incl:0,fx:()=>{const x=m();if(x)x.ctrl=1;S.fatti.terapiaCron=true;return ['Non si guarisce, ma con farmaci e controlli si vive meglio e più a lungo.','g']}},
    {l:'Curati con il Servizio sanitario',sub:'Gratis, ma con i tempi della sanità pubblica',cond:()=>gr()===2,fx:()=>{S.bis.stress=clamp(S.bis.stress+8);return cura(gr()===4?.42+S.salute/500:.75,'Mesi di visite, liste d\'attesa e cure. Ma ce l\'hai fatta: sei guarit'+g('o','a')+'.','Le cure non bastano. La malattia resta, e andrà seguita.')}},
    {l:'Vai in una clinica privata',sub:()=>eur(P(gr()===4?9000:2500)),cond:()=>gr()===2,fx:()=>{const c=P(gr()===4?9000:2500);if(S.soldi<c)return [`Servono ${eur(c)}.`,'x'];soldi(-c);return cura(gr()===4?.62+S.salute/500:.92,'Cure rapide e ottimi medici. Guarisci.','Nemmeno la clinica riesce a sconfiggerla del tutto.')}},

/* ---------- Aspirazioni ---------- */
function sceltaAspir(primo){
  return Object.entries(ASPIR).filter(([id])=>id!==primo).map(([id,A])=>({l:T(A.n),_incl:Math.max(-1,Math.min(1,A.w()*1.6)),fx:()=>{
    if(!primo){S.aspir=[id];coda.unshift({e:EV.aspirazioni2,d:{x:id}});return null}
    S.aspir=[primo,id];return [`Le tue aspirazioni: ${T(ASPIR[primo].n).toLowerCase()} e ${T(A.n).toLowerCase()}. Realizzarle ti renderà più felice; mancarle, col tempo, pesa.`,'g']}}));
}

ev({id:'inf_tv',min:3,max:6,once:1,t:'I cartoni',x:'Hai il telecomando in mano e nessuno ti guarda.',c:[
  {l:'Guardi cartoni per tre ore',e:{f:2},pers:{C:-2},r:'Ti trovano con gli occhi a forma di schermo.'},
  {l:'Spegni e vai a costruire una pista per le macchinine',e:{i:1},pers:{O:2,C:1},r:'La pista attraversa tutta la casa.'},
  {l:'Chiami qualcuno a guardarli con te',e:{f:2},pers:{E:2,A:1},r:'Divano, coperta e un pacco di biscotti.'}]});
ev({id:'inf_mare_onde',min:4,max:7,once:1,t:'Le onde',x:'Al mare le onde sono alte e gli altri bambini fanno a gara a chi va più lontano.',c:[
  {l:'Vai più lontano di tutti',p:.7,si:{e:{f:3},pers:{N:-2,E:1},r:'Vinci la gara e ti senti invincibile.'},no:{e:{f:-3,s:-2},pers:{N:2},r:'Un\'onda ti travolge. Bevi mezzo mare.'}},
  {l:'Resti dove si tocca',pers:{C:2},r:'Fai un castello di sabbia enorme, al sicuro.'},
  {l:'Chiedi a qualcuno di insegnarti a nuotare',e:{sport:2},pers:{O:1,C:1},r:'Prima lezione di nuoto. Bevi solo un po\' di mare.'}]});
ev({id:'inf_vicina',min:4,max:7,once:1,t:'La signora del piano di sotto',x:'La vicina anziana vive da sola e ti saluta sempre dal balcone.',c:[
  {l:'Le porti un disegno',e:{k:3,f:2},pers:{A:2,E:1},r:'Lo appende in cucina. Da quel giorno ti regala caramelle alla menta.'},
  {l:'Ti nascondi dietro la mamma',pers:{E:-2},r:'Lei sorride lo stesso.'},
  {l:'Le fai le boccacce',e:{k:-2},pers:{A:-2,E:1},r:'Ti sgridano. La signora fa finta di non aver visto.'}]});
ev({id:'inf_lettura',min:4,max:6,once:1,t:'Le lettere',x:'Scopri che le lettere sui cartelli formano parole.',c:[
  {l:'Le leggi tutte, una per una',e:{i:3},pers:{O:2,C:1},r:'In macchina leggi ad alta voce ogni insegna. Tutti impazziscono.'},
  {l:'Ti basta che te le leggano',pers:{O:-1},r:'Hai tempo per imparare.'},
  {l:'Inventi un alfabeto segreto',e:{i:2,f:2},pers:{O:3,E:-1},r:'Lo capisci solo tu, e va benissimo così.'}]});
ev({id:'inf_capriccio',min:2,max:5,once:1,t:'Il capriccio',x:'Al negozio vuoi un pupazzo e la risposta è no.',c:[
  {l:'Ti butti per terra e urli',p:.25,si:{e:{f:2},pers:{A:-2,C:-1},r:'Funziona. Pessimo precedente.'},no:{e:{f:-2},pers:{N:1,A:-1},r:'Torni a casa senza pupazzo e con una brutta figura.'}},
  {l:'Proponi un patto: fai il bravo per una settimana',p:.6,si:{e:{f:3},pers:{C:2},r:'Una settimana da sant{o}. Il pupazzo è tuo.'},no:{pers:{C:1},r:'«Vedremo.» Che vuol dire no.'}},
  {l:'Lo saluti e te ne vai',pers:{N:-1,C:1},r:'Ci pensi tutta la sera, ma non dici niente.'}]});
ev({id:'inf_nonno_lavoro',min:4,max:8,once:1,t:'Il laboratorio del nonno',cond:()=>vivi(['Nonno']).some(n=>n.sesso==='M'),x:'Il nonno ti porta nella sua officina piena di attrezzi.',c:[
  {l:'Lo aiuti ad aggiustare una sedia',fx:()=>{const n=vivi(['Nonno']).find(x=>x.sesso==='M');if(n)n.rapporto=clamp(n.rapporto+6);cambiaPers('C',2);S.abil.tech=clamp(S.abil.tech+2);return ['La sedia traballa ancora, ma il nonno dice che è perfetta.','g']}},
  {l:'Smonti una radio per vedere cosa c\'è dentro',e:{tech:3,i:1},pers:{O:3,C:-1},r:'Non torna più come prima, ma ora sai cos\'è un transistor.'},
  {l:'Ti annoi e vuoi tornare a casa',pers:{O:-1,E:1},r:'Il nonno ci resta un po\' male.'}]});
ev({id:'inf_maschere',min:4,max:9,once:1,t:'Carnevale',x:'Per Carnevale puoi scegliere il costume.',c:[
  {l:'Il supereroe del momento',e:{f:2},pers:{E:1},r:'In classe siete in cinque vestiti uguali.'},
  {l:'Un costume inventato da te',e:{arte:2,f:3},pers:{O:3},r:'Sei un «pomodoro astronauta». Nessuno capisce, tutti ammirano.'},
  {l:'Niente costume, non ti piace travestirti',pers:{E:-2},r:'Ti limiti a lanciare coriandoli agli altri.'}]});
ev({id:'inf_nonni_estate',min:4,max:8,once:1,t:'Un mese dai nonni',cond:()=>vivi(['Nonno']).length>0,x:'I tuoi lavorano e ti mandano un mese in campagna dai nonni.',c:[
  {l:'Ti godi galline, orto e bicicletta',fx:()=>{vivi(['Nonno']).forEach(n=>n.rapporto=clamp(n.rapporto+8));cambiaPers('O',1);mod('felicita',4);return ['Torni abbronzat'+g('o','a')+', con le ginocchia sbucciate e mille storie.','g']}},
  {l:'Ti manca casa e piangi ogni sera',e:{f:-3},pers:{N:2},r:'La nonna ti consola con le frittelle. Funziona solo in parte.'},
  {l:'Fai amicizia con i bambini del paese',e:{f:3},fx:()=>{nuovoAmico();cambiaPers('E',2);return ['Una banda di ragazzini in bicicletta, tutta l\'estate.','g']}}]});

/* ---------- Bambini (6–9) ---------- */
ev({id:'bam_compagno_banco',min:6,max:7,once:1,w:1.3,t:'Il compagno di banco',x:'Primo giorno di prima elementare: devi scegliere dove sederti.',c:[
  {l:'Vicino al bambino che sta da solo',fx:()=>{const p=nuovoAmico(true);cambiaPers('A',2);return [p?`Si chiama ${p.nome}. Diventa il tuo compagno di banco per cinque anni.`:'Vi capite al volo.','g']}},
  {l:'Al primo banco, vicino alla maestra',e:{voto:4},pers:{C:2,E:-1},r:'Non ti sfugge niente di quello che dice.'},
  {l:'In fondo, vicino alla finestra',e:{f:1},pers:{C:-2,O:1},r:'Il cortile è molto più interessante della lavagna.'}]});
ev({id:'bam_tabelline',min:7,max:9,once:1,t:'Le tabelline',x:'Domani c\'è la verifica sulla tabellina del sette.',c:[
  {l:'La ripeti fino a cena',e:{voto:5},pers:{C:2},r:'Sette per otto cinquantasei. Lo sai anche nel sonno.'},
  {l:'Ti inventi una canzoncina per ricordarla',e:{voto:4,musica:1},pers:{O:2},r:'Tutta la classe la canterà per anni.'},
  {l:'Speri nella fortuna',e:{voto:-4},pers:{C:-2},r:'La fortuna non conosce la tabellina del sette.'}]});
ev({id:'bam_figurine',min:6,max:10,once:1,t:'Le figurine',x:'Ti manca una sola figurina per finire l\'album, e ce l\'ha un compagno.',c:[
  {l:'Gli offri dieci doppie in cambio',p:.7,si:{e:{f:4},pers:{C:1,E:1},r:'Album completo! Lo mostri a tutti.'},no:{e:{f:-1},r:'Non vuole cederla per nessun motivo.'}},
  {l:'Gliela rubi dallo zaino',p:.6,si:{e:{f:1,k:-4},pers:{A:-3,C:-1},r:'Album completo, ma ogni volta che lo guardi ti senti stran{o}.'},no:{e:{f:-4,k:-3},pers:{N:1},r:'Ti scoprono. Figuraccia davanti a tutta la classe.'}},
  {l:'Lasci perdere: l\'album va bene anche così',pers:{N:-1,A:1},r:'Un buco nell\'ultima pagina. Pazienza.'}]});
ev({id:'bam_gita',min:6,max:10,once:1,t:'La gita',x:'Gita di classe allo zoo. La maestra dice di restare in fila.',c:[
  {l:'Resti in fila e prendi appunti',e:{i:1,voto:2},pers:{C:2},r:'Scopri che le giraffe dormono pochissimo.'},
  {l:'Ti allontani per vedere i pinguini',p:.6,si:{e:{f:3},pers:{O:2,C:-2},r:'I pinguini valevano la ramanzina.'},no:{e:{f:-3},pers:{N:1},r:'Ti cercano per mezz\'ora. Telefonata a casa.'}},
  {l:'Fai ridere tutti imitando le scimmie',e:{f:3},pers:{E:3},r:'Il pullman al ritorno è uno spettacolo comico.'}]});
ev({id:'bam_nuovo_compagno',min:6,max:10,once:1,t:'Il compagno nuovo',x:'Arriva in classe un bambino che non parla ancora bene l\'italiano. Tutti lo guardano.',c:[
  {l:'Lo inviti a giocare a pallone',fx:()=>{const p=nuovoAmico(true);cambiaPers('A',2);cambiaPers('O',1);S.abil.lingue=clamp(S.abil.lingue+2);return [p?`Impari da ${p.nome} qualche parola della sua lingua. Diventate amici.`:'Giocate tutta la ricreazione.','g']}},
  {l:'Lo osservi da lontano',pers:{E:-1},r:'Non sai bene come comportarti.'},
  {l:'Ridi delle sue parole sbagliate con gli altri',e:{k:-3},pers:{A:-3},r:'Ridono tutti. Lui no.'}]});
ev({id:'bam_cotta',min:7,max:10,once:1,t:'La prima cotta',x:'C\'è qualcuno in classe che ti fa diventare ross{o} ogni volta che ti guarda.',c:[
  {l:'Gli lasci un bigliettino anonimo',e:{f:2},pers:{O:1,N:1},r:'Passi una settimana a sperare che capisca chi è stato.'},
  {l:'Glielo dici in faccia',p:.4,si:{e:{f:6},pers:{E:2,N:-2},r:'Ti regala metà della sua merenda. È amore.'},no:{e:{f:-5},pers:{N:2},r:'Ride e lo dice a tutti. Giornata da dimenticare.'}},
  {l:'Lo tieni per te',pers:{E:-2},r:'Lo scrivi solo nel diario, con il lucchetto.'}]});
ev({id:'bam_bici_rubata',min:7,max:12,once:1,t:'La bici',x:'Fuori da scuola qualcuno ti ruba la bicicletta.',c:[
  {l:'Lo dici subito ai tuoi',fx:()=>{famG().forEach(p=>p.rapporto=clamp(p.rapporto+2));cambiaPers('A',1);return ['Fate denuncia insieme. La bici non torna, ma ti senti protett'+g('o','a')+'.','']}},
  {l:'La cerchi per tutto il quartiere',p:.3,si:{e:{f:6},pers:{C:2,N:-1},r:'La trovi legata a un palo: la riprendi!'},no:{e:{f:-3},pers:{C:1},r:'Tre giorni di ricerche. Niente.'}},
  {l:'Ti chiudi in camera e piangi',e:{f:-4},pers:{N:2},r:'Era la tua bici preferita.'}]});
ev({id:'bam_squadra',min:6,max:10,once:1,t:'Le squadre',x:'In palestra due capitani scelgono le squadre. Tu sei tra gli ultimi.',c:[
  {l:'Giochi al massimo per farglielo pagare',e:{sport:2},pers:{C:1,A:-1,N:-1},r:'Fai tre gol. La prossima volta ti sceglieranno subito.'},
  {l:'Ti viene il magone',e:{f:-3},pers:{N:2,E:-1},r:'Non giochi bene. Non ti importa nemmeno.'},
  {l:'Ci ridi su',e:{f:1},pers:{N:-2,E:1},r:'«Il migliore si sceglie per ultimo.» Ridono anche i capitani.'}]});
ev({id:'bam_diario',min:7,max:12,once:1,t:'Il diario segreto',x:'Ti regalano un diario con il lucchetto.',c:[
  {l:'Ci scrivi ogni sera',e:{i:1},pers:{O:2,C:2},r:'Pagine e pagine. Rileggerle da grande sarà bellissimo.'},
  {l:'Ci disegni fumetti',e:{arte:3},pers:{O:3},r:'Il diario diventa un fumetto a puntate.'},
  {l:'Lo usi per tre giorni e lo dimentichi',pers:{C:-2},r:'Lo ritroverai tra vent\'anni in cantina.'}]});
ev({id:'bam_genitori_litigano',min:6,max:12,once:1,t:'Le voci dalla cucina',cond:()=>famG().length>=2,x:'Una sera senti i tuoi litigare forte in cucina.',c:[
  {l:'Entri e chiedi di smettere',fx:()=>{cambiaPers('E',1);cambiaPers('A',1);famG().forEach(p=>p.rapporto=clamp(p.rapporto+2));S.fatti.intesaGenitori=clamp((S.fatti.intesaGenitori||60)+3);return ['Smettono subito e ti abbracciano. «Va tutto bene.»','']}},
  {l:'Ti metti le cuffie e non pensi',pers:{N:1,E:-1},r:'La musica copre tutto.'},
  {l:'Ti convinci che sia colpa tua',e:{f:-5},fx:()=>{S.fatti.famigliaDifficile=1;cambiaPers('N',3);return ['Non è colpa tua. Ma ci vorranno anni per capirlo.','b']}}]});
ev({id:'bam_responsabilita',min:7,max:11,once:1,t:'La pianta della classe',x:'La maestra ti affida la pianta della classe per le vacanze di Natale.',c:[
  {l:'La curi come un tesoro',e:{k:2},pers:{C:3},r:'Torna a scuola più verde di prima. La maestra ti affida anche il registro delle presenze.'},
  {l:'Te ne dimentichi',e:{f:-2},pers:{C:-2},r:'Torna a scuola un bastoncino secco. Imbarazzo totale.'},
  {l:'Le parli ogni giorno',e:{f:2},pers:{O:2,A:1},r:'Giuri che ti risponde.'}]});
ev({id:'bam_scommessa',min:8,max:12,once:1,t:'La sfida',x:'Un compagno ti sfida a saltare dal muretto più alto del cortile.',c:[
  {l:'Salti',p:.65,si:{e:{f:3},pers:{N:-2,E:1,C:-1},r:'Atterri in piedi. Leggenda del cortile.'},no:{e:{s:-6,f:-2},pers:{C:1},r:'Ti slogi la caviglia. Un mese con la stampella.'}},
  {l:'Dici che è una cosa stupida',pers:{C:2,A:-1},r:'Ti prendono in giro per un giorno. Ma hai due caviglie intere.'},
  {l:'Rilanci con una sfida più furba',e:{f:2},pers:{O:2,E:1},r:'«Chi fa più palleggi.» Vinci tu, ovviamente.'}]});
ev({id:'bam_ingiustizia',min:7,max:11,once:1,t:'La punizione ingiusta',x:'La maestra punisce tutta la classe per colpa di uno solo.',c:[
  {l:'Protesti a nome di tutti',p:.5,si:{e:{f:3},pers:{E:2,A:-1,N:-1},r:'La maestra ci ripensa. Per una settimana tutti vogliono sedersi vicino a te.'},no:{e:{f:-2,voto:-2},pers:{A:-1},r:'Ti becchi una nota in più.'}},
  {l:'Accetti in silenzio',pers:{A:1,C:1,E:-1},r:'Le regole sono regole.'},
  {l:'Convinci il colpevole a confessare',e:{k:2},pers:{A:2,E:1},r:'Ci vuole coraggio, ma confessa. Punizione tolta a tutti.'}]});
ev({id:'bam_stelle',min:7,max:12,once:1,t:'Le stelle',x:'In campagna, di notte, il cielo è pieno di stelle.',c:[
  {l:'Chiedi i nomi delle costellazioni',e:{i:2},pers:{O:3},r:'L\'Orsa Maggiore, Cassiopea, Orione. Ti appassioni allo spazio.'},
  {l:'Esprimi un desiderio su una stella cadente',e:{f:3},pers:{O:1,N:-1},r:'Non puoi dirlo, altrimenti non si avvera.'},
  {l:'Hai sonno e vuoi tornare dentro',pers:{O:-1},r:'Le stelle saranno lì anche domani.'}]});
ev({id:'bam_cane_scuola',min:6,max:10,once:1,t:'Il cane in cortile',x:'Un cane randagio entra nel cortile della scuola. I bambini scappano urlando.',c:[
  {l:'Ti avvicini piano e gli porgi la mano',p:.8,si:{e:{f:4,k:2},pers:{N:-2,A:2},r:'Ti lecca la mano. Lo chiamate Ricreazione.'},no:{e:{f:-3},pers:{N:2},r:'Ringhia. Torni di corsa dentro.'}},
  {l:'Chiami un bidello',pers:{C:2},r:'Il cane finisce al canile e trova una famiglia. Ti senti responsabile.'},
  {l:'Scappi con gli altri',pers:{N:1,E:1},r:'Urli anche tu, per solidarietà.'}]});

/* ---------- Bambini grandi (9–12) ---------- */
ev({id:'bam_segreto_amico',min:9,max:12,once:1,t:'Il segreto',cond:()=>vivi(['Amico']).length>0,x:d=>{d.p=d.p||pick(vivi(['Amico']));return `${d.p.nome} ti confida un segreto e ti fa giurare di non dirlo a nessuno.`},c:[
  {l:'Lo mantieni',fx:d=>{d.p.rapporto=clamp(d.p.rapporto+8);ricorda(d.p,'Hai mantenuto il suo segreto');cambiaPers('A',1);cambiaPers('C',1);return ['Il vostro legame diventa fortissimo.','g']}},
  {l:'Lo racconti a un altro amico',fx:d=>{d.p.rapporto=clamp(d.p.rapporto-15);ricorda(d.p,'Hai raccontato il suo segreto');cambiaPers('A',-2);return [`Il segreto fa il giro della classe. ${d.p.nome} non ti parla per un mese.`,'b']}},
  {l:'Lo scrivi nel diario',fx:d=>{d.p.rapporto=clamp(d.p.rapporto+3);cambiaPers('O',1);return ['Al sicuro, con il lucchetto.','']}}]});
ev({id:'bam_paghetta',min:9,max:12,once:1,t:'La prima paghetta',x:'I tuoi decidono di darti 10 € a settimana.',c:[
  {l:'Li metti nel salvadanaio',e:{m:60},pers:{C:3},r:'In tre mesi hai abbastanza per il gioco che volevi.'},
  {l:'Li spendi subito in caramelle e figurine',e:{f:3},pers:{C:-2},r:'Il venerdì sei già al verde.'},
  {l:'Compri un regalo per la mamma',fx:()=>{const m=vivi(['Madre'])[0];if(m)m.rapporto=clamp(m.rapporto+6);cambiaPers('A',2);return ['Una tazza con scritto «Mamma migliore del mondo». La usa ancora.','g']}}]});
ev({id:'bam_compito_copiato',min:9,max:12,once:1,t:'Il compito in classe',x:'Il tuo compagno di banco ti chiede di fargli copiare la verifica.',c:[
  {l:'Gli fai copiare',p:.7,si:{e:{f:1},pers:{A:2,C:-1},r:'Prendete lo stesso voto. Ti sarà riconoscente.'},no:{e:{voto:-6},pers:{N:1},r:'La maestra vi scopre: zero a tutti e due.'}},
  {l:'Rifiuti',pers:{C:2,A:-1},r:'Ti tiene il broncio per due giorni.'},
  {l:'Gli spieghi gli esercizi all\'intervallo',e:{voto:2,k:2},pers:{A:2,E:1},r:'La volta dopo ce la fa da solo.'}]});
ev({id:'bam_sport_gara',min:9,max:12,once:1,t:'La gara',x:'Alla gara di corsa sei in testa, ma un compagno inciampa vicino a te.',c:[
  {l:'Ti fermi ad aiutarlo',e:{k:4,f:2},pers:{A:3},r:'Arrivate ultimi insieme. Tutto lo stadio applaude.'},
  {l:'Continui e vinci',e:{f:3,sport:2},pers:{A:-1,C:1},r:'Medaglia d\'oro. Lui si rialza da solo.'},
  {l:'Rallenti per vedere se sta bene, poi riparti',e:{f:1},pers:{A:1},r:'Arrivi terz{o}. Una buona via di mezzo.'}]});
ev({id:'bam_videogioco',min:9,max:12,once:1,t:'Il videogioco',x:'Ti regalano una console. Il primo livello è difficilissimo.',c:[
  {l:'Ci provi finché non lo superi',e:{tech:3},pers:{C:2,N:-1},r:'Al cinquantesimo tentativo ce la fai. Urlo di vittoria.'},
  {l:'Lanci il controller',e:{f:-2},pers:{N:2,A:-1},r:'Il controller sopravvive. La tua pazienza no.'},
  {l:'Chiedi aiuto a un amico più bravo',e:{tech:2},pers:{E:2,A:1},r:'Pomeriggi interi a giocare insieme.'}]});
ev({id:'bam_trasloco_amico',min:9,max:12,once:1,t:'L\'amico che se ne va',cond:()=>vivi(['Amico']).length>0,x:d=>{d.p=d.p||pick(vivi(['Amico']));return `${d.p.nome} ti dice che la sua famiglia si trasferisce in un\'altra città.`},c:[
  {l:'Prometti di scrivervi ogni settimana',fx:d=>{d.p.lontano=true;d.p.rapporto=clamp(d.p.rapporto+5);cambiaPers('A',1);cambiaPers('C',1);return ['Vi scrivete per anni. Una vera amicizia a distanza.','g']}},
  {l:'Fai finta che non ti importi',fx:d=>{d.p.lontano=true;cambiaPers('N',1);cambiaPers('E',-1);return ['Dentro ti si spezza qualcosa, ma non lo dici.','b']}},
  {l:'Organizzi una festa d\'addio',fx:d=>{d.p.lontano=true;d.p.rapporto=clamp(d.p.rapporto+8);cambiaPers('E',2);mod('felicita',2);return ['Torta, palloncini e un album di foto di voi due.','g']}}]});
ev({id:'bam_cellulare_ritrovato',min:9,max:12,once:1,t:'Il portafoglio',x:'Al parco trovi un portafoglio con dentro 50 €.',c:[
  {l:'Lo porti ai vigili',e:{k:6},pers:{C:2,A:2},r:'Il proprietario ti regala 10 € e una stretta di mano.'},
  {l:'Tieni i soldi e butti il portafoglio',e:{m:50,k:-6},pers:{A:-3,C:-1},r:'Cinquanta euro. Un peso nello stomaco che dura giorni.'},
  {l:'Lo dai ai tuoi e decidete insieme',fx:()=>{famG().forEach(p=>p.rapporto=clamp(p.rapporto+3));cambiaPers('A',1);S.karma=clamp(S.karma+4);return ['Lo riportate insieme. Papà è fiero di te.','g']}}]});
ev({id:'bam_esperimento',min:9,max:12,once:1,t:'L\'esperimento',x:'Hai visto in TV come costruire un vulcano con bicarbonato e aceto.',c:[
  {l:'Lo costruisci in cucina',p:.6,si:{e:{i:2,f:3},pers:{O:3},r:'L\'eruzione è spettacolare. Anche il disastro sul pavimento.'},no:{e:{f:-1},pers:{O:2,C:-1},r:'Esplode troppo presto. Aceto sulle tende.'}},
  {l:'Lo prepari per la scuola, con cartellone e spiegazione',e:{voto:4,i:2},pers:{C:3,O:1},r:'Il professore lo mostra alle altre classi.'},
  {l:'Lo guardi e basta',pers:{O:-1},r:'In TV sembra più facile.'}]});
ev({id:'bam_presa_in_giro',min:9,max:12,once:1,t:'Il soprannome',x:'In classe ti hanno dato un soprannome che non ti piace per niente.',c:[
  {l:'Ci ridi sopra e lo fai tuo',e:{f:1},pers:{N:-2,E:2},r:'Se non ti offende, smette di funzionare. Infatti dopo un mese non lo usa più nessuno.'},
  {l:'Rispondi con un soprannome peggiore',pers:{A:-2,E:1},r:'Guerra di soprannomi. Nessun vincitore.'},
  {l:'Ci soffri in silenzio',e:{f:-5},pers:{N:3,E:-2},r:'Ogni mattina andare a scuola è un po\' più pesante.'},

ev({id:'ado_nonno_storia',min:13,max:17,once:1,t:'La storia del nonno',cond:()=>vivi(['Nonno']).length>0,x:d=>{d.p=d.p||pick(vivi(['Nonno']));return `${d.p.nome} ti racconta di quando aveva la tua età e se ne andò di casa per lavorare.`},c:[

  {l:'Registri la storia per non dimenticarla',fx:d=>{d.p.rapporto=clamp(d.p.rapporto+10);cambiaPers('C',1);cambiaPers('O',1);return ['Un giorno quella registrazione varrà più di tutto.','g']}},
  {l:'Guardi il telefono mentre parla',fx:d=>{d.p.rapporto=clamp(d.p.rapporto-5);cambiaPers('A',-1);return ['Il nonno se ne accorge e smette di raccontare.','b']}}]});

ev({id:'ado_prof',min:14,max:17,once:1,t:'Il professore',x:'C\'è un professore che sembra avercela con te.',c:[

ev({id:'ado_ansia_esame',min:14,max:17,once:1,t:'La notte prima',x:'Domani c\'è il compito più importante dell\'anno e non riesci a dormire.',c:[
  {l:'Ripassi fino alle quattro',e:{voto:2,s:-2},pers:{C:1,N:2},r:'Sai tutto, ma hai gli occhi a palla.'},

ev({id:'ado_giornalino',min:14,max:17,once:1,t:'Il giornalino della scuola',x:'Cercano qualcuno per il giornalino della scuola.',c:[
  {l:'Ti proponi come direttore',p:.6,si:{e:{f:3},pers:{E:2,C:2},r:'Prima uscita: 200 copie, tutte esaurite.'},no:{e:{f:-1},pers:{E:1},r:'Ti prendono come redattore. Si comincia da lì.'}},

ev({id:'ado_scambio',min:15,max:17,once:1,t:'Lo scambio all\'estero',x:'La scuola offre tre mesi di scambio in Irlanda, con una famiglia del posto.',c:[
  {l:'Parti',costo:1500,fx:()=>{S.abil.lingue=clamp(S.abil.lingue+12);cambiaPers('O',3);cambiaPers('E',1);cambiaPers('N',-1);segnaVita('viaggio');mod('felicita',6);return ['Tre mesi di pioggia, scones e un inglese che non sapevi di avere.','g']}},
  {l:'Hai paura di stare lontano da casa',pers:{N:1,O:-1},r:'Lo racconteranno gli altri, al ritorno.'},

ev({id:'ado_scelta_futuro',min:15,max:17,once:1,t:'Che cosa farai',x:'All\'incontro di orientamento ti chiedono cosa vuoi fare dopo il diploma.',c:[
  {l:'Hai un piano preciso',e:{voto:2},pers:{C:3},r:'Facoltà, città e lavoro. Ti invidiano tutti.'},
  {l:'Tante idee, nessuna certezza',pers:{O:2,N:1},r:'Medico, regista, archeologo. O tutti e tre.'},
  {l:'Vuoi lavorare subito e guadagnare',pers:{C:1,O:-1},r:'Basta libri: vuoi la tua indipendenza.'},
  {l:'Non ci vuoi pensare',pers:{C:-2},r:'Mancano ancora anni. Più o meno.'}]});
ev({id:'ado_ripetente',min:14,max:17,once:1,t:'A rischio',cond:()=>iscritto()&&S.scuola.voto<45,x:'I voti sono pessimi. Se continui così, perdi l\'anno.',c:[
  {l:'Chiedi aiuto a un compagno bravo',fx:()=>{S.scuola.voto=clamp(S.scuola.voto+10);nuovoAmico(true);cambiaPers('E',1);cambiaPers('C',1);return ['Pomeriggi in biblioteca insieme. Recuperi, e trovi un amico.','g']}},
  {l:'Ti chiudi in camera a studiare',e:{voto:8},pers:{C:3},r:'Due mesi duri. Il recupero arriva.'},
  {l:'Tanto la scuola non fa per te',e:{voto:-3},pers:{C:-2,N:1},r:'Smetti di provarci.'}]});
ev({id:'ado_talento',min:13,max:17,once:1,t:'Un talento',x:'Un insegnante ti ferma dopo la lezione: «Hai un talento, sai?»',c:[
  {l:'Ci credi e ti impegni',e:{f:3,arte:2,musica:2},pers:{C:2,N:-2},r:'Per la prima volta qualcuno ha visto qualcosa in te.'},
  {l:'Pensi che lo dica a tutti',pers:{N:1},r:'Non ci credi. Ma la frase ti resta in testa.'},
  {l:'Lo racconti a casa, orgoglios{o}',fx:()=>{relGenitori(4);cambiaPers('E',1);mod('felicita',4);return ['Tua madre lo racconta a tutte le zie.','g']}}]});

ev({id:'ado_motorino_amico',min:14,max:17,once:1,t:'Il motorino',x:'Un amico ti offre un passaggio sul motorino. Il casco è uno solo.',c:[
  {l:'Sali senza casco',p:.85,si:{e:{f:3},pers:{C:-2,N:-1},r:'Il vento in faccia. Andata bene.'},no:{e:{s:-12,f:-5},pers:{C:2,N:2},r:'Una buca, una caduta, un gesso. Ci penserai due volte.'}},

  {l:'Lo convinci ad andare a piedi insieme',pers:{A:1,E:1},r:'Una chiacchierata lunghissima lungo la strada.'}]});
ev({id:'ado_festa_alcol',min:15,max:17,once:1,t:'La festa in casa',x:'A una festa a casa di un compagno un ragazzo sta male per aver bevuto troppo.',c:[
  {l:'Chiami il 112',fx:()=>{S.karma=clamp(S.karma+6);cambiaPers('C',2);cambiaPers('A',2);return ['L\'ambulanza arriva in dieci minuti. Gli hai probabilmente salvato la vita.','g']}},
  {l:'Lo assisti tu finché sta meglio',p:.8,si:{e:{k:4},pers:{A:2,N:-1},r:'Acqua, posizione laterale e tanta pazienza. Si riprende.'},no:{e:{k:2,f:-4},pers:{N:2},r:'Peggiora. Alla fine arriva l\'ambulanza, e il panico.'}},
  {l:'Te ne vai prima che arrivino guai',e:{k:-4},pers:{A:-2,C:-1},r:'Il giorno dopo scopri che è finito in ospedale.'}]});
ev({id:'ado_soldi_facili',min:15,max:17,once:1,t:'I soldi facili',x:'Un ragazzo più grande ti offre 50 € per consegnare un pacchetto senza fare domande.',c:[
  {l:'Rifiuti',pers:{C:2,A:1},r:'Non vuoi sapere cosa c\'era dentro.'},
  {l:'Accetti',p:.7,si:{e:{m:50,k:-5},fx:()=>{S.crim.exp=(S.crim.exp||0)+1;cambiaPers('C',-2);cambiaPers('A',-1)},r:'Cinquanta euro in dieci minuti. Troppo facile.'},no:{e:{k:-5},pr:'droga'}},
  {l:'Lo racconti a un adulto',fx:()=>{cambiaPers('C',2);cambiaPers('A',-1);S.karma=clamp(S.karma+3);return ['L\'adulto avverte la polizia. Ti senti un po\' spia, un po\' giust'+g('o','a')+'.','']}}]});
ev({id:'ado_fumo_amici',min:14,max:17,once:1,t:'La canna',x:'Al parco gira una canna. Tutti ti guardano.',c:[
  {l:'Fai un tiro',e:{f:2},pers:{O:2,C:-2},r:'Ridi per un\'ora di niente. Poi fame infinita.'},

ev({id:'ado_social_foto',min:13,max:17,once:1,t:'La foto',x:'Qualcuno ha pubblicato una tua foto imbarazzante. Ha già cento commenti.',c:[
  {l:'La commenti con autoironia',p:.7,si:{e:{f:2},pers:{N:-2,E:1},r:'La tua battuta diventa il commento più votato.'},no:{e:{f:-3},pers:{N:1},r:'Peggiora tutto.'}},
  {l:'La segnali e chiedi di toglierla',p:.6,si:{pers:{C:1},r:'Viene rimossa in un giorno.'},no:{e:{f:-3},pers:{N:2},r:'Resta online. Ogni notifica è una fitta.'}},

ev({id:'ado_notte_videogiochi',min:13,max:16,once:1,t:'Ancora una partita',x:'È l\'una di notte. Domani c\'è scuola. La squadra online ti aspetta.',c:[

ev({id:'ado_viaggio_solo',min:16,max:17,once:1,t:'Il primo viaggio da soli',x:'Con tre amici organizzate un weekend al mare senza genitori.',c:[

  {l:'Ci vai con entusiasmo',e:{k:5},pers:{A:3},r:'Il signor Giuseppe ti insegna a giocare a scopa. Lo batti solo a giugno.'},

ev({id:'ado_patentino',min:14,max:15,once:1,t:'Il patentino',x:'Puoi fare il patentino per il motorino.',c:[

  {l:'Non ti interessa, preferisci la bici',e:{sport:2},pers:{O:-1,C:1},r:'Gambe d\'acciaio e zero benzina.'}]});
ev({id:'ado_rabbia',min:13,max:17,once:1,t:'La rabbia',x:'Per una sciocchezza ti sale una rabbia che non riconosci.',c:[
  {l:'Tiri un pugno al muro',e:{s:-3},pers:{N:2,A:-2},r:'Nocche gonfie e un buco nel cartongesso.'},

ev({id:'ado_compleanno18',min:17,max:17,once:1,w:2,t:'Quasi diciott\'anni',x:'Manca poco ai diciott\'anni. Cosa vuoi per il grande giorno?',c:[

  {l:'Niente: non ami essere al centro dell\'attenzione',pers:{E:-2},r:'Una pizza con i tuoi. Va benissimo così.'}]});

ev({id:'ad_coinquilino',min:19,max:30,rip:6,cond:()=>S.fatti.fuorisede||S.casa.tipo==='affitto',t:'Il coinquilino',x:'Il tuo coinquilino non lava mai i piatti. La pila nel lavandino ormai ha una personalità tutta sua.',c:[
  {l:'Glielo dici chiaro e tondo',p:.6,si:{e:{f:2},pers:{A:-3,N:-1},r:'Si offende per un giorno, poi compra perfino un detersivo nuovo.'},no:{e:{f:-3},pers:{A:-3,N:1},r:'Litigate. Per un mese vi parlate solo con i post-it sul frigo.'}},
  {l:'Proponi i turni delle pulizie',e:{f:1},pers:{C:3,A:1},r:'Tabella sul frigo, un colore per ognuno. Funziona per ben tre settimane.'},
  {l:'Li lavi tu, come sempre',e:{f:-2},pers:{A:2,N:2},r:'Pace in casa. Un po\' meno pace dentro di te.'},
  {l:'Smetti di lavarli anche tu',pers:{C:-3},r:'Dopo dieci giorni la cucina è zona rossa. Ordinate pizza e fingete che vada tutto bene.'}]});
ev({id:'ad_teatro',min:18,max:60,rip:15,t:'Improvvisazione',x:'Un\'amica ti trascina a una lezione di prova di teatro d\'improvvisazione. «Dai, sali anche tu!»',c:[
  {l:'Sali sul palco e ti butti',p:()=>.45+pz('E')*.25,si:{e:{f:6},pers:{E:4,O:2,N:-1},r:'Fai ridere tutta la sala. Il giorno dopo ti iscrivi al corso.'},no:{e:{f:-2},pers:{E:2,N:1},r:'Ti blocchi davanti a tutti. Però sei salit{o}, e la seconda volta va meglio.'}},
  {l:'Guardi dal fondo della sala',pers:{E:-2},r:'Ridi tantissimo. Ma dal fondo.'}]});
ev({id:'ad_terapia',min:18,max:65,rip:6,cond:()=>S.bis.stress>55||S.felicita<45,t:'Un consiglio',x:'Un\'amica ti guarda e dice: «Ti vedo strano da mesi. Hai mai pensato di parlarne con uno psicologo?»'.replace('strano','stran{o}'),c:[
  {l:'Prendi un appuntamento',sub:()=>'Dieci sedute, circa '+eur(P(600)),cond:()=>S.soldi>=P(600),fx:()=>{soldi(-P(600));S.bis.stress=clamp(S.bis.stress-12);mod('felicita',4)},pers:{N:-5,O:1},r:'Le prime sedute sono strane. Poi, un martedì, dici una cosa ad alta voce e capisci molte cose.'},
  {l:'Ce la faccio da sol{o}',pers:{N:2,E:-1},r:'Stringi i denti. Funziona, più o meno.'},
  {l:'Ne parli con gli amici',fx:()=>{const a=pick(vivi(['Amico']));if(a){a.rapporto=clamp(a.rapporto+5);ricorda(a,'Ti sei confidat'+g('o','a')+' in un periodo difficile')}S.bis.stress=clamp(S.bis.stress-5)},pers:{E:2,N:-1},r:'Una serata a parlare davvero. Non risolve tutto, ma ti senti meno sol{o}.'}]});
ev({id:'ad_segreto',min:18,max:70,rip:10,chi:['Amico'],pc:p=>p.rapporto>=40,t:'Il segreto',x:'{Tuo} {P} ha raccontato a mezzo mondo una cosa che ti aveva giurato di tenere per sé.',c:[
  {l:'Glielo rinfacci, poi perdoni',e:{rel:-3},pers:{A:3,N:-1},r:'Una discussione dura. Poi una birra. {P} ti chiede scusa, e stavolta sembra sincer{po}.'},
  {l:'Chiudi i rapporti',fx:d=>{d.p.rapporto=clamp(d.p.rapporto-40);ricorda(d.p,'Avete chiuso per un segreto tradito')},pers:{A:-3,N:1},r:'Esce dalla tua vita. Da oggi ti fiderai meno facilmente.'},
  {l:'Fai finta di niente',e:{rel:-8},pers:{A:1,N:2,E:-1},r:'Sorridi come sempre. Ma da oggi gli racconti molto meno.'.replace('gli','{gli}')}]});
ev({id:'ad_resto',min:18,max:90,rip:10,t:'Il resto sbagliato',x:'Al supermercato la cassiera ti dà cinquanta euro di resto in più. Te ne accorgi in macchina.',c:[
  {l:'Torni indietro a restituirli',e:{k:4,f:1},pers:{A:2,C:2},r:'La cassiera quasi si commuove: a fine turno li avrebbe dovuti mettere lei.'},

ev({id:'ad_strada',min:20,max:85,rip:6,cond:()=>haAuto(),t:'Al semaforo',x:'Un automobilista ti taglia la strada e poi suona pure. Al semaforo vi ritrovate fianco a fianco.',c:[
  {l:'Abbassi il finestrino e gliene dici quattro',p:.7,si:{e:{f:1},pers:{A:-3,N:2},r:'Ti senti benissimo per dieci secondi. Poi il cuore ti batte forte fino a casa.'},no:{e:{s:-2,f:-3},pers:{A:-3,N:3},r:'Scende dall\'auto. Volano parole grosse, quasi le mani. Arrivi a casa tremando.'}},

  {l:'Gli fai un sorriso enorme',pers:{A:2,O:1},r:'Lo spiazzi completamente. Vincere così ha tutto un altro sapore.'}]});

  {l:'Guardi anche tu il telefono',pers:{A:-2,N:1},r:'Scendi alla tua fermata. Ci ripensi tutto il giorno.'}]});
ev({id:'ad_detox',min:18,max:65,rip:10,t:'Lo schermo',x:'Il telefono ti informa che la settimana scorsa l\'hai usato in media cinque ore al giorno.',c:[
  {l:'Niente social per un mese',p:()=>.4+pz('C')*.4,si:{fx:()=>{S.bis.stress=clamp(S.bis.stress-8)},e:{f:5},pers:{C:3},r:'Il primo weekend è un\'astinenza. Il quarto leggi due libri.'},no:{pers:{C:1},r:'Resisti undici giorni. Poi un video di gatti ti riporta dentro.'}},

ev({id:'ad_errore',min:18,max:66,rip:8,cond:()=>lavora(),t:'L\'errore',x:'Ti accorgi di aver sbagliato un conto importante. Nessuno se n\'è accorto, per ora.',c:[
  {l:'Lo dici subito al capo',p:.7,si:{e:{perf:2},pers:{C:3,N:-2},r:'«Grazie per avermelo detto.» Da quel giorno si fida di te.'},no:{e:{perf:-4},pers:{C:2},r:'Una sfuriata memorabile. Ma almeno la notte dormi.'}},
  {l:'Lo correggi di nascosto',p:.65,si:{pers:{C:-1,N:2},r:'Nessuno se ne accorge. Però per settimane apri la posta col cuore in gola.'},no:{e:{perf:-8},pers:{N:3},r:'Se ne accorgono. E capiscono che hai provato a nasconderlo.'}},
  {l:'Dai la colpa al programma',p:.55,si:{e:{k:-3},pers:{A:-3},r:'Il reparto informatico incassa. Tu un po\' meno, la sera.'},no:{e:{perf:-6,k:-3},pers:{A:-3,N:1},r:'Il tecnico dimostra che il programma funziona benissimo. Figuraccia.'}}]});
ev({id:'ad_mobbing',min:22,max:66,rip:10,cond:()=>lavora(),t:'Il collega preso di mira',x:'Da settimane il capo umilia un collega davanti a tutti. Nessuno dice niente.',c:[
  {l:'Lo difendi in riunione',p:.55,si:{e:{k:5,f:3,perf:-2},pers:{A:3,N:-2,E:1},r:'Cala il silenzio. Il giorno dopo tre colleghi ti ringraziano a bassa voce.'},no:{e:{k:5,perf:-6},pers:{A:3,N:1},r:'Ora il capo ce l\'ha anche con te. Ma il collega non lo dimenticherà.'}},
  {l:'Lo inviti a pranzo e lo ascolti',fx:()=>{if(vivi(['Amico']).length<12){const a=nuovaPersona('Amico','M',Math.max(22,S.eta+r(-8,8)),null,{rapporto:r(45,60)});ricorda(a,'L\'hai ascoltato quando il capo lo umiliava')}},e:{k:3},pers:{A:3},r:'In ufficio non cambia niente. Per lui, invece, cambia parecchio.'},
  {l:'Tieni la testa bassa',pers:{A:-1,N:2},r:'Meglio lui che te. Lo pensi, e non ti piace pensarlo.'},
  {l:'Ti allinei al capo',e:{perf:3,k:-5},pers:{A:-4},r:'Una battuta in più alle sue spalle. Il capo ti sorride.'}]});
ev({id:'ad_firma',min:25,max:66,once:1,cond:()=>lavora(),t:'La firma',x:'Ti chiedono di firmare un documento con dei numeri gonfiati. «Lo fanno tutti, è una formalità.»',c:[
  {l:'Rifiuti di firmare',p:.6,si:{e:{k:6},pers:{C:3,A:1},r:'Firma qualcun altro. Sei mesi dopo arriva la Finanza, e il tuo nome non c\'è.'},no:{e:{k:6,perf:-10},pers:{C:3,N:1},r:'Ti spostano in un ufficio senza finestre. Hai la coscienza pulita e un cactus.'}},
  {l:'Firmi e non ci pensi più',e:{perf:3,k:-4},fut:[2,'ad_firma_conto'],pers:{C:-2,A:-1},r:'Una firma veloce. Il capo ti dà una pacca sulla spalla.'},
  {l:'Lo segnali all\'ufficio legale',p:.5,si:{e:{perf:4,k:6},pers:{C:2,E:2,N:-1},r:'Indagine interna. Il capo viene trasferito e tu diventi «quell{o} di cui fidarsi».'},no:{e:{perf:-12,f:-6,k:6},pers:{C:2,N:2},r:'Insabbiano tutto. Ti fanno capire che hai sbagliato a parlare.'}}]});
ev({id:'ad_firma_conto',min:18,max:100,link:1,t:'L\'ispezione',x:'Arriva la Guardia di Finanza. Controllano proprio i documenti che avevi firmato.',auto:{fx:()=>{if(chance(.45)){const m=P(3000);soldi(-m);mod('felicita',-8);if(S.lavoro)S.lavoro.perf=clamp(S.lavoro.perf-15);applicaPers({N:3,C:2});return [`L'ispezione trova tutto. Ti tocca una sanzione di ${eur(m)} e una lunga serie di notti in bianco.`,'b']}return ['L\'ispezione si concentra su altro. Ti è andata bene, ma il cuore ti è arrivato in gola.','']}}});
ev({id:'ad_valutazione',min:22,max:66,rip:8,cond:()=>lavora(),t:'La valutazione',x:'Nella valutazione annuale il capo scrive di te: «Manca di iniziativa». E lo legge davanti a tutto il gruppo.',c:[
  {l:'Ringrazi e chiedi come migliorare',e:{perf:4},pers:{C:2,N:-2},r:'Il capo resta spiazzato. Tre mesi dopo ti affida un progetto tutto tuo.'},
  {l:'Ti difendi, punto per punto',p:.5,si:{e:{perf:2},pers:{A:-2,N:-1},r:'Hai ragione tu, e alla fine lo ammette pure.'},no:{e:{perf:-4},pers:{A:-2,N:1},r:'Sembri una persona che non accetta critiche. E un po\' è vero.'}},
  {l:'Ci rimugini per settimane',e:{f:-4},pers:{N:3},r:'Rileggi quella frase mille volte. Di notte, soprattutto.'}]});
ev({id:'ad_fallimento',min:22,max:55,once:1,cond:()=>lavora()||iscritto(),t:'Il no',x:'Il progetto su cui hai lavorato per due anni viene bocciato. Tutto da rifare, o da buttare.',c:[
  {l:'Ricominci il giorno dopo',e:{perf:3,f:-1},pers:{C:3,N:-2},r:'Lo smonti, lo rifai, lo ripresenti. La seconda volta passa.'},
  {l:'Ti prendi una pausa e ci ripensi',e:{f:1},pers:{N:-1,O:2},r:'Un mese senza pensarci. Poi lo guardi con altri occhi, e ti viene un\'idea migliore.'},
  {l:'Basta, non fa per te',e:{f:-4},pers:{C:-2,N:2},r:'Chiudi la cartella sul computer. Non la riaprirai più.'}]});

/* ---------- Mezza età ---------- */
ev({id:'ad_lingua',min:25,max:75,once:1,t:'Una nuova lingua',x:d=>{d.lng=d.lng||pick(['giapponese','portoghese','arabo','russo','coreano','svedese']);return `Il comune organizza un corso serale di ${d.lng}. Le iscrizioni chiudono domani.`},c:[

  {l:'Non è il momento',pers:{O:-1},r:'Ci sarà tempo.'}]});
ev({id:'ad_cassetto',min:32,max:58,once:1,t:'Il sogno nel cassetto',x:'Mettendo in ordine trovi un quaderno di quando avevi vent\'anni, con la lista delle cose che volevi fare nella vita.',c:[
  {l:'Ne scegli una e la fai davvero',fx:()=>{mod('felicita',8);return [pick(['Impari a suonare il pianoforte, una nota storta alla volta.','Vai a vedere l\'aurora boreale. Piangi un po\', di nascosto.','Corri la tua prima gara, arrivando trecentesim{o}. Felicissim{o}.','Scrivi un racconto e lo mandi a un concorso. Arriva quarto.']).replace(/\{o\}/g,g('o','a'))+' Non era troppo tardi.','g']},pers:{O:3,C:2}},
  {l:'Sorridi e lo rimetti nel cassetto',e:{f:-1},pers:{N:1},r:'Era un\'altra persona. O forse no.'},

ev({id:'ad_vicini',min:25,max:85,rip:12,cond:inCasaTua,t:'I vicini nuovi',x:d=>{d.da=d.da||pick(['dal Senegal','dal Perù','dall\'Ucraina','dal Bangladesh','dal Marocco','dalle Filippine']);return `Nell'appartamento accanto si trasferisce una famiglia arrivata ${d.da}. I bambini ti salutano ogni mattina.`},c:[

  {l:'Saluti e basta',pers:{E:-1},r:'Buongiorno, buonasera. Va bene così.'},
  {l:'Ti lamenti degli odori di cucina',e:{k:-3},pers:{A:-3,O:-2},r:'Lo dici all\'amministratore. In condominio in tanti smettono di salutarti.'}]});
ev({id:'ad_figlio_bullo',min:30,max:65,rip:5,chi:['Figlio'],pc:p=>p.eta>=9&&p.eta<=15,t:'La telefonata da scuola',x:'Ti chiamano da scuola: {P} prende in giro un compagno di classe da settimane.',c:[
  {l:'L{po} porti a chiedere scusa di persona',e:{rel:-3,k:3},fx:d=>{if(d.p.pers)d.p.pers.A=clamp(d.p.pers.A+4)},pers:{A:2,C:2},r:'Un pomeriggio difficile. {P} borbotta le scuse, poi in macchina piange. Qualcosa ha capito.'},
  {l:'Ci parli a lungo, senza urlare',e:{rel:3},fx:d=>{if(d.p.pers)d.p.pers.A=clamp(d.p.pers.A+2)},pers:{A:2,N:-2},r:'Scopri che l\'anno prima era {lui} a essere pres{po} di mira.'},
  {l:'Niente telefono per un mese',e:{rel:-6},pers:{C:2,A:-1},r:'Un mese di musi lunghi. Le prese in giro finiscono, il rancore un po\' meno.'},

ev({id:'ad_salute',min:40,max:75,once:1,t:'Un campanello d\'allarme',x:'Il medico è serio: «Se non cambia stile di vita, tra dieci anni ne riparliamo in ospedale».',c:[
  {l:'Cambi davvero: dieta e passeggiate',p:()=>.45+pz('C')*.35,si:{e:{s:8,f:3},fx:()=>{S.bis.forma=clamp(S.bis.forma+10)},pers:{C:4,N:-1},r:'Un anno dopo hai otto chili in meno e le analisi di un ventenne. Il medico quasi non ci crede.'},no:{e:{s:2},pers:{C:2},r:'Ci provi sul serio per tre mesi. Poi tornano le vecchie abitudini, ma qualcosa resta.'}},
  {l:'Da lunedì, giuri',pers:{C:-2},r:'Il lunedì arriva ogni settimana. Il cambiamento no.'},
  {l:'Ti fai prendere dal panico',e:{f:-4},pers:{N:4},r:'Notti a cercare sintomi su internet. Scopri malattie che non sapevi esistessero.'}]});
ev({id:'ad_rimpatriata',min:37,max:60,once:1,cond:()=>S.istr.liv>=2,t:'Vent\'anni dopo',x:'Arriva l\'invito alla cena per i vent\'anni dalla maturità. Il gruppo WhatsApp è già impazzito.',c:[
  {l:'Ci vai e parli con tutti',e:{f:5},fx:()=>{if(chance(.4))nuovoAmico()},pers:{E:3},r:'Chi è ingrassato, chi ha divorziato, chi è diventato dirigente. Siete tutti uguali, solo più stanchi.'},
  {l:'Ci vai, ma stai con i soliti due',e:{f:3},r:'Un angolo del ristorante, tre vecchi amici e mille ricordi.'},
  {l:'Non vai: il passato è passato',pers:{E:-3},r:'Il giorno dopo guardi le foto. Non ti sei pers{o} niente. Forse.'}]});
ev({id:'ad_riconcilia',min:25,max:85,once:1,chi:['Madre','Padre','Fratello'],pc:p=>p.rapporto<35&&p.eta>=18,t:'Una telefonata inattesa',x:'{Tuo} {P}, con cui non parli quasi più, ti chiama: «Possiamo vederci? Vorrei chiederti scusa».',c:[
  {l:'Accetti e ascolti',e:{rel:25,f:6},fx:d=>{ricorda(d.p,'Avete fatto pace dopo anni')},pers:{A:4,N:-2},r:'Un caffè che dura tre ore. Non si sistema tutto, ma qualcosa sì.'},
  {l:'Accetti, ma metti le cose in chiaro',e:{rel:12,f:3},pers:{A:1,N:-2},r:'Dici tutto quello che non avevi mai detto. {Lui} incassa. È un inizio.'},
  {l:'Non sei pront{o}',e:{rel:-3},pers:{A:-2,N:1},r:'Riattacchi. Ci ripensi per giorni.'}]});
ev({id:'ad_meditazione',min:25,max:80,rip:15,t:'Il ritiro',x:'Un collega ti racconta di un weekend di meditazione in silenzio in un monastero. «Ti cambia la vita, giuro.»',c:[
  {l:'Ci vai',p:()=>.5+pz('O')*.3,si:{e:{f:6},fx:()=>{S.bis.stress=clamp(S.bis.stress-15)},pers:{N:-4,O:2},r:'Due giorni senza parlare. Ti accorgi che non avevi mai davvero ascoltato i tuoi pensieri.'},no:{pers:{O:1},r:'Il secondo giorno scappi al bar del paese a prendere un caffè. Però ci hai provato.'}},
  {l:'Non fa per te',pers:{O:-2},r:'Il silenzio ti mette ansia solo a pensarci.'}]});
ev({id:'ad_bugia',min:20,max:80,rip:8,chi:['Partner','Coniuge'],t:'La piccola bugia',x:'{P} scopre che avevi detto di essere al lavoro, ma eri al bar a guardare la partita con un amico.',c:[
  {l:'Ammetti e chiedi scusa',e:{rel:-2},pers:{A:2,C:2},r:'«Bastava dirmelo.» Ha ragione.'},
  {l:'Inventi un\'altra bugia',p:.5,si:{e:{rel:-1},pers:{C:-2,A:-2},r:'Regge. Per ora.'},no:{e:{rel:-12},pers:{C:-2,A:-2,N:1},r:'Due bugie sono peggio di una. Stanotte dormi sul divano.'}},
  {l:'Ti arrabbi: «Mi controlli?»',e:{rel:-8},pers:{A:-3,N:2},r:'Il contrattacco funziona male. Come sempre.'}]});
ev({id:'ad_figlio_strada',min:42,max:85,once:1,chi:['Figlio'],pc:p=>p.eta>=19&&p.eta<=35,t:'La sua strada',x:d=>{d.sogno=d.sogno||pick(['lascia il posto in banca per aprire un chiosco sulla spiaggia in Portogallo','molla l\'università per fare il musicista','si trasferisce in Australia, «almeno per qualche anno»','vuole aprire un rifugio per cani in montagna']);return `${d.p.nome} ti annuncia che ${d.sogno}. Poi ti guarda, in attesa.`},c:[
  {l:'L{po} sostieni, anche se hai paura',e:{rel:10,f:2},pers:{A:3,O:3,N:-1},r:'«Grazie», ti dice. Non ti abbracciava così da quando era piccol{po}.'},
  {l:'Provi a fargli cambiare idea'.replace('gli','{gli}'),e:{rel:-6},pers:{C:2,O:-2},r:'Un lungo discorso su futuro e sicurezza. Ti ascolta, educatamente, e poi fa di testa sua.'},
  {l:'Ti arrabbi: «Non contare su di me»',e:{rel:-18,f:-3},fx:d=>{ricorda(d.p,'Non hai appoggiato la sua scelta')},pers:{A:-3,O:-2},r:'Una porta sbattuta. Per mesi vi sentite solo a Natale.'}]});

/* ---------- Terza età ---------- */
ev({id:'ad_primo_lunedi',min:60,max:80,once:1,cond:()=>!S.lavoro&&S.pensione>0,t:'Il primo lunedì',x:'Primo lunedì da pensionat{o}. Ti svegli alle sei per abitudine e non sai cosa fare.',c:[
  {l:'Ti butti nel volontariato',e:{k:6,f:5},pers:{A:3,E:2},r:'Al banco alimentare ti aspettano il martedì e il giovedì. Ti senti di nuovo utile.'},
  {l:'Riprendi una vecchia passione',e:{f:5,arte:3},pers:{O:3},r:'I pennelli erano in cantina da trent\'anni. Non hanno dimenticato niente, e neanche tu.'},
  {l:'Ti godi il divano, finalmente',e:{f:2},pers:{E:-2,O:-2},r:'Il primo mese è bellissimo. Il secondo un po\' meno.'},
  {l:'Organizzi le giornate al minuto',e:{f:2},pers:{C:3},r:'Spesa alle nove, passeggiata alle dieci, pranzo a mezzogiorno in punto. In famiglia ti prendono in giro.'}]});
ev({id:'ad_lettera',min:55,max:90,once:1,t:'Una lettera',x:'Al laboratorio di scrittura vi chiedono di scrivere una lettera a voi stessi a vent\'anni.',c:[
  {l:'Scrivi di non avere paura',e:{f:4},pers:{N:-3},r:'«Andrà meglio di quanto pensi.» Rileggendola, capisci che vale anche adesso.'},

ev({id:'ad_vecchio_rancore',min:60,max:95,once:1,chi:['Nemico','Ex'],t:'Dopo tanti anni',x:'{P} ti scrive dopo tanti anni: «Siamo vecchi, non ha più senso avercela l\'uno con l\'altro».',c:[

  {l:'Rispondi gentilmente, ma a distanza',pers:{A:1},r:'Un messaggio cordiale. Il resto può restare dov\'è.'},
  {l:'Non rispondi',pers:{A:-3},r:'Certe cose non si dimenticano. Neanche a ottant\'anni.'}]});
ev({id:'ad_nonni_sitter',min:50,max:85,rip:8,chi:['Figlio'],pc:p=>vivi(['Nipote']).some(n=>n.gen===p.id&&n.eta<11),t:'Nonni a tempo pieno',x:'{Tuo} {P} ti chiede di tenere i bambini tre pomeriggi a settimana.',c:[
  {l:'Sì, con gioia',e:{rel:8,f:4},fx:d=>{S.bis.energia=clamp(S.bis.energia-8);vivi(['Nipote']).filter(n=>n.gen===d.p.id).forEach(n=>n.rapporto=clamp(n.rapporto+10))},pers:{A:3,E:1},r:'Merende, compiti, cartoni animati. Torni a casa sfinit{o} e felice.'},
  {l:'Un pomeriggio sì, gli altri no',e:{rel:-2},pers:{C:2},r:'Metti dei paletti. {P} capisce, più o meno.'},
  {l:'No: hai già dato',e:{rel:-10},pers:{A:-3},r:'«Ho cresciuto te, adesso tocca a te.» Silenzio al telefono.'}]});
ev({id:'ad_viaggio_tardi',min:65,max:85,once:1,cond:()=>S.soldi>=P(3500)&&S.salute>45,t:'Il viaggio rimandato',x:d=>{d.dove=d.dove||pick(['il Giappone','la Patagonia','l\'Islanda','New York','l\'India','il Canada']);return `Da cinquant'anni dici che un giorno vedrai ${d.dove}. Le gambe ancora reggono.`},c:[
  {l:'Prenoti e parti',sub:()=>'Circa '+eur(P(3500)),fx:()=>{soldi(-P(3500));segnaVita('viaggio')},e:{f:12},pers:{O:4,E:1},r:'Un viaggio lungo e faticoso, e bellissimo. Torni con mille foto e una ginocchiera.'},
  {l:'Non è più cosa per te',e:{f:-2},pers:{O:-2},r:'Lo guardi in un documentario. È quasi la stessa cosa, ti dici.'}]});
ev({id:'ad_apprendista',min:50,max:80,once:1,t:'L\'apprendista',x:'Un ragazzo del quartiere ti chiede di insegnargli quello che sai fare meglio.',c:[
  {l:'Gli dedichi un pomeriggio a settimana',e:{f:6,k:3},fx:()=>{if(vivi(['Amico']).length<12){const a=nuovaPersona('Amico','M',r(16,22),null,{rapporto:r(55,70)});ricorda(a,'Gli hai insegnato il mestiere')}},pers:{A:3,C:1,E:1},r:'All\'inizio è un disastro. Un anno dopo è più bravo di te, e te lo dice pure.'},
  {l:'Non hai la pazienza',pers:{A:-2},r:'«Guarda i tutorial», gli dici. Ci rimane male.'}]});
ev({id:'ad_casa_vuota',min:55,max:95,once:1,cond:()=>!!vedovo()&&single(),t:'La casa vuota',x:()=>`Da quando non c'è più ${vedovo().nome}, la casa è troppo silenziosa.`,c:[
  {l:'Ti iscrivi al centro anziani',e:{f:6},fx:()=>{nuovoAmico()},pers:{E:4,N:-2},r:'Burraco il lunedì, gite il giovedì. La sera racconti la giornata alla sua foto.'},
  {l:'Chiami più spesso i tuoi cari',fx:()=>{vivi(['Figlio','Fratello','Nipote']).forEach(p=>p.rapporto=clamp(p.rapporto+5))},e:{f:3},pers:{A:2,E:1},r:'Una telefonata al giorno. Scopri che anche loro ne avevano bisogno.'},

/* ================= EVENTI: famiglia e regole italiane (separazione, adozione, eredità) ================= */

/* ---------- Separazione con figli minorenni ---------- */
ev({id:'affido',link:1,k:'Famiglia',t:'I figli',x:d=>{const n=vivi(['Figlio']).filter(f=>f.eta<18&&!f.conEx).length;return `Tu e ${d.p.nome} vi separate e avete ${n===1?'un figlio minorenne':n+' figli minorenni'}. Per legge l'affido è condiviso: dovete decidere con chi vivranno.`},c:[
  {l:'Vivono con te',sub:'L\'altro genitore ti versa un assegno di mantenimento',_incl:0,fx:d=>{
    const fg=vivi(['Figlio']).filter(f=>f.eta<18&&!f.conEx);fg.forEach(f=>{f.alterni=false;f.rapporto=clamp(f.rapporto+4)});
    mantenimento(d.p.id,fg,1);d.p.rapporto=clamp(d.p.rapporto-5);
    return [`I figli restano con te. ${d.p.nome} li vedrà nei fine settimana e ti verserà un assegno di mantenimento.`,'']}},
  {l:'Vivono con {P}',sub:'Tu versi l\'assegno di mantenimento e li vedi nei fine settimana',_incl:0,fx:d=>{
    const fg=vivi(['Figlio']).filter(f=>f.eta<18&&!f.conEx);fg.forEach(f=>{f.conEx=true;f.rapporto=clamp(f.rapporto-6)});
    mantenimento(d.p.id,fg,-1);pesa(8,4);
    let t=`I figli vanno a vivere con ${d.p.nome}. Tu verserai un assegno di mantenimento e li vedrai nei fine settimana.`;
    const mia=casaMia();
    if(mia){S.fatti.casaAssegnata={pid:mia.id,a:d.p.id};S.casa=affittoBase('Bilocale');t+=` La casa resta a loro finché i figli non crescono: tu prendi un bilocale in affitto.`}
    else if(S.casa.tipo==='affitto'){S.casa=affittoBase('Bilocale');t+=' Lasci a loro la casa e cerchi un bilocale.'}
    return [t,'b']}},

/* ================= AZIONI ================= */
function fatto(k){return !!S.azioni[k]}
function cdAzione(k){
  if(/^c_/.test(k))return k==='c_palestra'?2:12;
  if(/^(esame_|corso_)/.test(k))return 6;
  if(/^crim_/.test(k))return 3;
  if(/^mis_/.test(k))return 4;
  if(/^post_/.test(k))return 2;
  if(/sposa$/.test(k))return 6;
  if(k==='clan')return 6;
  const T0={collega:2,att_vacanza:3,att_chirurgia:12,att_terme:2,att_psi:6,att_clinica:3,att_patente:2,att_provino:3,att_libro:24,att_prodotti:12,att_benef:6,compra_fol:6,aumento:6,promo:4,nuoviamici:2};
  return T0[k]||1;
}
function segnaAz(k){S.azioni[k]=1;S.cdAz[k]=S.t+cdAzione(k)}
function attesa(k){const m=(S.cdAz[k]||0)-S.t;return m<=1?'Fatto questo mese':`Riprova tra ${m} mesi`}
const stanco=()=>`Sei troppo stanc${g('o','a')}: riposa un po' o alleggerisci la settimana.`;
function una(k,costo,fn,en){
  return ()=>{
    if(S.azioni[k])return [attesa(k)+'.','x'];
    en=en===undefined?5:en;
    if(en&&S.bis&&S.bis.energia<en+4)return [stanco(),'x'];
    if(costo&&S.soldi<costo)return [`Non hai abbastanza soldi (servono ${eur(costo)}).`,'x'];
    segnaAz(k);if(costo)soldi(-costo);if(en&&S.bis)S.bis.energia=clamp(S.bis.energia-en);return fn();
  };
}
/* Azione lanciata da una scheda: mostra un messaggio breve */
function azione(fn){
  const res=fn();
  if(res===KEEP)return;
  if(res===null){next();return}
  if(res&&res[0]){if(res[1]!=='x')log(res[0],res[1]);toast(res[0])}
  save();render();
}
function rataMutuo(P,anni,i){return Math.round(P*i/(1-Math.pow(1+i,-anni)))}

function cura(p2,p4){
  const curate=[];
  S.malattie=S.malattie.filter(m=>{
    if(m.g===4&&!m.tum&&chance(p4+.3))m.ctrl=1;   // cuore e fegato non guariscono: le cure li tengono sotto controllo
    if(m.g===1||(m.g===2&&chance(p2))){curate.push(m.n);return false}
    return true;
  });
  const cron=S.malattie.filter(m=>m.g===3);
  if(cron.length)S.fatti.terapiaAnno=S.anno;
  if(curate.length)mod('salute',r(4,8)+curate.length*2);
  let t=curate.length?`Curat${g('o','a')}: ${curate.join(', ').toLowerCase()}.`:'';
  if(cron.length)t+=` Terapia per ${cron.map(m=>m.n.toLowerCase()).join(', ')}: quest'anno non peggiorerà.`;
  const rest=S.malattie.filter(m=>m.g!==3);
  if(rest.length)t+=` Restano da curare: ${rest.map(m=>m.n.toLowerCase()).join(', ')}.`;
  if(!S.malattie.length&&!curate.length)t='Check-up completo: sei in buona salute.';
  return [t.trim(),curate.length?'g':(rest.length?'b':'g')];
}

function dona(x){
  if(S.soldi<x)return ['Non hai abbastanza soldi.','x'];
  const L=LX(),prima=L.donato;soldi(-x);L.donato+=realeEur(x);

const b64da=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64a=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function codiceDa(X){
  const t=JSON.stringify(X);
  try{if(typeof CompressionStream!=='undefined'){const st=new Blob([t]).stream().pipeThrough(new CompressionStream('gzip'));return 'VITAMIA1Z:'+b64da(await new Response(st).arrayBuffer())}}catch(e){}
  return 'VITAMIA1J:'+b64da(new TextEncoder().encode(t));
}
async function statoDaCodice(c){
  c=String(c||'').trim();
  if(c.startsWith('{'))return JSON.parse(c);
  const m=c.match(/^VITAMIA1([ZJ]):([A-Za-z0-9+/=\s]+)$/);
  if(!m)throw new Error('formato');
  const u=b64a(m[2].replace(/\s+/g,''));
  if(m[1]==='Z'){const st=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
  return JSON.parse(new TextDecoder().decode(u));
}

    const uid=await user.id();if(!uid)return;
    SALVA.db=db;SALVA.uid=uid;

async function salvaOnline(){
  if(!SALVA.db||!SALVA.uid||!S)return false;
  try{
    const z=await codiceDa(S);

    const d={z,t:Date.now(),nome:S.nome+' '+S.cognome,eta:S.eta,anno:S.anno,mese:S.mese,vivo:S.vivo,chi:S.nome+S.cognome+S.annoNascita};

  C={ses,nome:nomeGen(ses,a),cognome:pick(COGNOMI),com:cc.n,prov:cc.s,anno:a,mese:new Date().getMonth(),giorno:r(1,28),num:r(120,9800),tab:(C&&C.tab)||'tu',fam:null};
  famCasuale();noteCasuali();C.look=lookFiglio(C.fam.madre.look,C.fam.padre.look,ses);
}
function datiVita(){
  const F=C.fam;
  return {sesso:C.ses,nome:C.nome.trim()||nomeGen(C.ses,C.anno),cognome:C.cognome.trim()||pick(COGNOMI),citta:C.com,prov:C.prov,anno:C.anno,meseN:C.mese,giorno:C.giorno,look:C.look,
    note:C.note,fam:{classe:F.classe,madre:{...F.madre,nome:F.madre.nome.trim()||nomeGen('F',C.anno-F.madre.eta),cognome:F.madre.cognome.trim()||pick(COGNOMI)},padre:{...F.padre,nome:F.padre.nome.trim()||nomeGen('M',C.anno-F.padre.eta)},fratelli:F.fratelli.map(f=>({...f,nome:f.nome.trim()||nomeGen(f.sesso,C.anno-f.eta)}))}};
}

/* ---------- Il certificato ---------- */

  const F=C.fam,pr=PROV[C.prov]||{n:C.prov,r:''};

  const cl={umile:'modesta',media:'della classe media',agiata:'benestante'}[F.classe];
  return `<div class="cert-h"><div><span class="cert-k">Certificato di nascita</span><span class="cert-n">N. ${C.anno} / ${String(C.num).padStart(4,'0')} · Comune di ${esc(C.com)}</span></div>
    <button class="cert-dado" id="btnMescola" aria-label="Rimescola tutto" title="Rimescola tutto">${ICO_DADO}</button></div>
  <div class="cert-main">
    <button class="cert-foto" data-tab="aspetto" aria-label="Modifica l'aspetto">${volto(C.look,0,C.ses)}</button>
    <div class="cert-chi">
      <button class="cert-nome" data-tab="tu">${esc(C.nome||'…')} ${esc(C.cognome||'…')}</button>
      <button class="cert-riga" data-tab="dove">${gC('nato','nata')} il <b>${C.giorno} ${MESI[C.mese]} ${C.anno}</b>, alle ${C.note.ora}<br>a <b>${esc(C.com)}</b> (${esc(C.prov)}), ${esc(pr.r)}</button>
    </div>
  </div>
  <button class="cert-fam" data-tab="famiglia">
    <span class="cert-l">${gC('Figlio','Figlia')} di</span>
    <span class="cert-gens"><span class="cert-gen"><span class="mini">${volto(F.madre.look,F.madre.eta,'F',{sfondo:false})}</span><span><b>${esc(F.madre.nome||'…')} ${esc(F.madre.cognome||'')}</b><small>${F.madre.eta} anni</small></span></span>
    <span class="cert-gen"><span class="mini">${volto(F.padre.look,F.padre.eta,'M',{sfondo:false})}</span><span><b>${esc(F.padre.nome||'…')} ${esc(C.cognome||'')}</b><small>${F.padre.eta} anni</small></span></span></span>
    <span class="cert-l">${F.fratelli.length?(F.fratelli.length===1?(F.fratelli[0].sesso==='M'?'Fratello':'Sorella'):'Fratelli'):'Fratelli'}</span><span class="cert-v">${fr}</span>
    <span class="cert-l">Famiglia</span><span class="cert-v">${cl}</span>
  </button>
  <div class="cert-note">Peso ${C.note.peso} kg · ${C.note.lung} cm · Segni particolari: ${C.note.segno.replace(/\{o\}/g,gC('o','a'))}</div>`;

  $('#btnMescola').onclick=e=>{e.stopPropagation();bozzaCasuale();disegnaCert();disegnaEd()};

function disegnaEd(){
  const P=$('#edP');if(!P)return;P.innerHTML=htmlEditor();
  document.querySelectorAll('[data-et]').forEach(b=>b.setAttribute('aria-selected',b.dataset.et===C.tab));
  const F=C.fam,su=()=>disegnaCert(),tutto=()=>{disegnaCert();disegnaEd()};
  const on=(sel,ev,fn)=>{const el=P.querySelector(sel);if(el)el[ev]=fn};
  // Tu
  P.querySelectorAll('[data-ses]').forEach(b=>b.onclick=()=>{if(C.ses===b.dataset.ses)return;C.ses=b.dataset.ses;C.nome=nomeNuovo(C.ses,[]);const t=lookCasuale(C.ses);C.look.taglio=t.taglio;C.look.barba=t.barba;tutto()});
  on('#iNome','oninput',e=>{C.nome=e.target.value;su()});on('#iCog','oninput',e=>{C.cognome=e.target.value;su()});
  on('#dNome','onclick',()=>{C.nome=nomeNuovo(C.ses,[C.nome]);tutto()});on('#dCog','onclick',()=>{C.cognome=pick(COGNOMI);tutto()});
  // Quando e dove
  const I=P.querySelector('#iCom'),SG=P.querySelector('#sugg');
  if(I){
    I.onfocus=()=>I.select();
    I.oninput=()=>{const q=normTxt(I.value.replace(/\s*\(.*$/,'').trim());if(q.length<2){SG.hidden=true;return}
      const L=comuni(),a=[],b=[];for(const c of L){const n=normTxt(c.n);if(n.startsWith(q))a.push(c);else if(b.length<20&&n.includes(q))b.push(c);if(a.length>=6)break}
      const R=[...a.sort((x,y)=>y.p-x.p),...b].slice(0,6);
      SG.innerHTML=R.length?R.map((c,i)=>`<button data-i="${i}">${esc(c.n)} <small>${esc((PROV[c.s]||{}).n||c.s)} · ${esc((PROV[c.s]||{}).r||'')}</small></button>`).join(''):'<div class="note">Nessun comune con questo nome.</div>';SG.hidden=false;
      SG.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const c=R[+x.dataset.i];C.com=c.n;C.prov=c.s;tutto()})};
    I.onkeydown=e=>{if(e.key==='Enter'){const f=SG.querySelector('[data-i]');if(f)f.click()}};
  }
  on('#dCom','onclick',()=>{const c=comuneCaso();C.com=c.n;C.prov=c.s;tutto()});
  const dt=()=>{C.giorno=Math.min(C.giorno,giorniMese(C.anno,C.mese));tutto()};
  on('#iG','onchange',e=>{C.giorno=+e.target.value;su()});on('#iM','onchange',e=>{C.mese=+e.target.value;dt()});on('#iA','onchange',e=>{C.anno=+e.target.value;dt()});
  // Famiglia
  P.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{F.classe=b.dataset.cl;tutto()});
  on('#iMN','oninput',e=>{F.madre.nome=e.target.value;su()});on('#iMC','oninput',e=>{F.madre.cognome=e.target.value;su()});on('#iPN','oninput',e=>{F.padre.nome=e.target.value;su()});
  P.querySelectorAll('[data-frn]').forEach(x=>x.oninput=()=>{F.fratelli[+x.dataset.frn].nome=x.value;su()});
  P.querySelectorAll('[data-frs]').forEach(x=>x.onclick=()=>{const f=F.fratelli[+x.dataset.frs];f.sesso=f.sesso==='M'?'F':'M';f.nome=nomeNuovo(f.sesso,[]);tutto()});
  P.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.st,d=+b.dataset.d,maxFr=()=>Math.max(1,Math.min(12,F.madre.eta-18));
    if(id==='em'){F.madre.eta=clamp(F.madre.eta+d,18,46);F.fratelli.forEach(f=>f.eta=Math.min(f.eta,maxFr()))}
    else if(id==='ep')F.padre.eta=clamp(F.padre.eta+d,18,65);
    else if(id==='nf'){if(d>0&&F.fratelli.length<4)F.fratelli.push(fratelloNuovo());if(d<0)F.fratelli.pop()}
    else if(id.startsWith('fe')){const f=F.fratelli[+id.slice(2)];f.eta=clamp(f.eta+d,1,maxFr())}
    tutto()});
  on('#dFam','onclick',()=>{famCasuale();C.look=lookFiglio(F.madre.look,F.padre.look,C.ses);tutto()});
  // Aspetto
  P.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{C.look[b.dataset.lk]=+b.dataset.v;tutto()});
  P.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{C.look.taglio=b.dataset.tg;tutto()});
  P.querySelectorAll('[data-bb]').forEach(b=>b.onclick=()=>{C.look.barba=b.dataset.bb;tutto()});
  on('#dLook','onclick',()=>{const m=C.look.maglia;C.look=lookFiglio(C.fam.madre.look,C.fam.padre.look,C.ses);C.look.maglia=m;tutto()});
}

/* ---------- «Nasci»: timbro, battito, presentazione ---------- */
function nasci(o){
  const anim=!navigator.webdriver||/[?&]anim(=|&|$)/.test(location.search);
  C=null;
  if(!anim){nuovaVita(o);return}
  const cert=$('#cert');
  if(cert){
    const d=`${o.giorno} ${MESI[o.meseN].slice(0,3)} ${o.anno}`.toUpperCase();
    cert.insertAdjacentHTML('beforeend',`<div class="timbro" aria-hidden="true"><b>${o.sesso==='F'?'NATA':'NATO'}</b><span>${esc(d)}</span><span>${esc(o.citta.toUpperCase().slice(0,22))}</span></div>`);
    cert.classList.add('timbrato');
  }
  document.querySelectorAll('#btnNasci,#btnRnd').forEach(b=>b.disabled=true);
  const ov=document.createElement('div');ov.className='nascita';ov.id='nascita';ov.innerHTML='<div class="n-dot"></div><div class="benv" id="benv"></div>';
  setTimeout(()=>{
    document.body.appendChild(ov);
    setTimeout(()=>{nuovaVita(o);$('#benv').innerHTML=htmlBenvenuto();$('#btnInizia').onclick=()=>{ov.classList.add('via');setTimeout(()=>ov.remove(),400)}},700);
    setTimeout(()=>ov.classList.add('apri'),1450);
  },cert?650:0);
}
function htmlBenvenuto(){
  const ma=vivi(['Madre'])[0],pa=vivi(['Padre'])[0],fr=vivi(['Fratello']);
  const fam=[[ma,'mamma'],[pa,'papà'],...fr.map(f=>[f,gp(f,'fratello','sorella')])].filter(x=>x[0]);
  // somiglianze raggruppate per genitore: «gli occhi e i capelli di tua madre»
  const L=lookDi(S),da={madre:[],padre:[]};
  const chi=k=>ma&&ma.look&&ma.look[k]===L[k]?'madre':pa&&pa.look&&pa.look[k]===L[k]?'padre':null;
  const co=chi('occhi'),cc=chi('capelli');if(co)da[co].push('gli occhi');if(cc)da[cc].push('i capelli');
  const parti=[['madre','tua madre'],['padre','tuo padre']].filter(([k])=>da[k].length).map(([k,n])=>`${da[k].join(' e ')} di ${n}`);
  const car=ma&&pa?(B5.reduce((s,b)=>s+Math.abs(S.pers[b.k]-ma.pers[b.k]),0)<B5.reduce((s,b)=>s+Math.abs(S.pers[b.k]-pa.pers[b.k]),0)?'tua madre':'tuo padre'):null;
  const somiglia=parti.length?`Hai ${parti.join(', ')}${car?` e, dicono, il carattere di ${car}`:''}.`:`Non somigli a nessuno dei due. La nonna giura che sei identic${g('o','a')} allo zio.`;
  const cl={umile:'Una famiglia dalle condizioni modeste.',media:'Una famiglia della classe media.',agiata:'Una famiglia benestante.'}[S.classe];
  return `<div class="benv-foto">${volto(L,0,S.sesso)}</div>
    <p class="benv-k">${S.giornoNascita} ${MESI[S.meseNascita]} ${S.annoNascita} · ${esc(S.citta)}</p>
    <h2>Benvenut${g('o','a')} al mondo,<br>${esc(S.nome)}.</h2>
    <p class="benv-p">${esc(somiglia)}</p>
    <div class="benv-sec">La tua famiglia</div>
    <div class="benv-fam">${fam.map(([p,r])=>`<figure>${volto(lookDi(p),p.eta,p.sesso)}<figcaption><b>${esc(p.nome)}</b>${r}, ${p.eta}</figcaption></figure>`).join('')}</div>
    <p class="benv-p muted">${cl}</p>
    <div class="benv-sec">Il tuo carattere</div>
    <div class="tags">${aggettivi(S.pers,S.sesso,3).map(a=>`<span class="tag">${esc(a)}</span>`).join('')||'<span class="tag">equilibrat'+g('o','a')+'</span>'}</div>
    <p class="benv-p muted">Lo scoprirai crescendo: cambierà con quello che vivrai.</p>
    <button class="btn" id="btnInizia">Inizia a vivere</button>`;
}

let soloDisponibili=false;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function hue(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))%360;return h}
function bar(v,col){return `<span class="bar"><i style="width:${clamp(v)}%;background:var(${col})"></i></span>`}
function kv(a,b,cls){return `<div class="kv"><span>${a}</span><b${cls?` class="${cls}"`:''}>${b}</b></div>`}

/* ---------- Foglio ---------- */
function showSheet(o){
  sheetOpen=true;$('#scrim').hidden=false;
  const d=o.d||{};
  $('#shK').textContent=o.k||'';$('#shT').textContent=o.t||'';
  const P=$('#shP');P.textContent=o.p||'';P.className='';P.hidden=!o.p;
  const A=$('#shA');A.innerHTML='';
  const sc=(o.scelte||[]).filter(c=>!c.cond||c.cond(d));
  let attivi=0;
  const clic=c=>{
    const res=o.d?conCausa(o.t,()=>scegli(c,d)):scegli(c,d);
    if(res===KEEP)return;
    if(res===null){next();return}
    if(res&&res[0]&&res[1]!=='x')log(res[0],res[1]);
    save();risultato(res||['','']);
  };
  if(o.cerca){
    const w=document.createElement('div');w.className='cerca';

/* Com'eri e cosa ti ha cambiato */
function storiaCarattere(){
  let t='';
  const piu=(k,v)=>'più '+cambioPers(k,v);
  const H=(S.persStoria||[]).filter(h=>h.eta>=12&&h.eta<=S.eta-6);
  const ref=(S.eta>=25&&H.find(h=>h.eta===18))||H[0];
  if(ref){
    const dif=B5.map(b=>[b.k,S.pers[b.k]-ref.p[b.k]]).filter(([,v])=>Math.abs(v)>=5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3).map(([k,v])=>piu(k,v));
    t+=`\n\nRispetto a quando avevi ${ref.eta} anni `+(dif.length?`sei ${dif.length>1?dif.slice(0,-1).join(', ')+' e '+dif[dif.length-1]:dif[0]}.`:`sei rimast${S.sesso==='F'?'a':'o'} quasi la stessa persona.`);
  }
  if(S.persBase){
    const tmp=B5.map(b=>[b.k,S.pers[b.k]-S.persBase[b.k]]).filter(([,v])=>Math.abs(v)>=4).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2).map(([k,v])=>piu(k,v));
    if(tmp.length)t+=`\n\nPer quello che hai vissuto di recente, in questo periodo sei ${tmp.join(' e ')} del solito. Col tempo, in parte, passerà.`;
  }
  const L=(S.persSegni||[]).filter(x=>x.c).map(x=>({...x,m:Object.values(x.d).reduce((s,v)=>s+Math.abs(v),0)})).filter(x=>x.m>=1.2).sort((a,b)=>b.m-a.m);
  // da bambini il carattere cambia molto di più: le svolte da adulto hanno uno spazio tutto loro
  const top=[...L.filter(x=>x.eta<18).slice(0,S.eta>=25?3:6),...L.filter(x=>x.eta>=18).slice(0,4)].sort((a,b)=>a.t-b.t);
  if(top.length)t+='\n\nCosa ti ha cambiato:\n'+top.map(x=>{
    const qu=x.eta<1?`Da neonat${S.sesso==='F'?'a':'o'}`:`A ${x.eta} ann${x.eta===1?'o':'i'}`;
    const ch=Object.entries(x.d).filter(([,v])=>Math.abs(v)>=.6).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2).map(([k,v])=>piu(k,v)).join(' e ');
    return `· ${qu} — ${x.c}: ${ch}`;
  }).join('\n');
  return t;
}

let attTab='settimana';
function costoRoutineMese(){
  const e=S.eta;let t=0;
  if(e>=14){if(rOre('sport')>=3)t+=P(e>=18?35:20);if(rOre('uscite'))t+=P(e>=18?9:4)*rOre('uscite')*4.3;if(rOre('amici')&&e>=16)t+=P(2.5)*rOre('amici')*4.3;if(S.hobby&&rOre('hobby')&&(e>=18||!genitoriVivi()))t+=P(38)}
  return Math.round(t*(1.2-S.pers.C/250));
}
function renderSettimana(){
  if(S.eta<6)return '<div class="panel"><div class="meta">Fino a 6 anni sono i tuoi genitori a decidere come passi le giornate.</div></div>';
  if(S.carcere>0)return '<div class="panel"><div class="meta">In carcere le giornate le decide il regolamento.</div></div>';
  normalizzaRoutine();
  const ob=obblighi(),lib=oreLibere(),us=oreRoutine(),rip=lib-us;
  let h=`<div class="sec"><span>Ore fisse a settimana</span><span>su 168</span></div><div class="panel">${ob.map(([n,x])=>kv(esc(n),x+' h')).join('')}<div class="kv tot"><span>Ore libere</span><b>${lib} h</b></div>
    <div class="rrow"><div><div class="jn">Sonno a notte</div><div class="jm">${S.sonno<7?'Poco: meno energia, più stress':S.sonno>8.5&&S.eta>=18?'Tanto: meno ore libere':'Giusto'}</div></div><div class="step"><button class="chip" data-sonno="-0.5" ${S.sonno<=5?'disabled':''} aria-label="Meno sonno">−</button><b>${String(S.sonno).replace('.',',')} h</b><button class="chip" data-sonno="0.5" ${S.sonno>=10||rip<3.5?'disabled':''} aria-label="Più sonno">+</button></div></div></div>`;
  h+=`<div class="sec"><span>Come usi il tempo libero</span><span>${us} h usate</span></div><div class="list">`;
  for(const a of ATT_R){
    if(S.eta<a.min||(a.cond&&!a.cond()))continue;
    const v=S.routine[a.id]||0;
    h+=`<div class="rrow"><div><div class="jn">${esc(nomeAttR(a))}</div><div class="jm">${esc(a.d)}</div></div><div class="step"><button class="chip" data-r="${a.id}" data-d="-1" ${v<=0?'disabled':''} aria-label="Meno">−</button><b>${v} h</b><button class="chip" data-r="${a.id}" data-d="1" ${rip<1?'disabled':''} aria-label="Più">+</button></div></div>`;
  }
  h+=`</div><div class="panel" style="margin-top:10px">${kv('Riposo e tempo per te',`${rip} h`)}${bar(Math.min(100,rip*2.5),rip<10?'--bad':'--salute')}<div class="meta">${rip<10?'Quasi nessun momento per te: l\'energia scende e lo stress sale.':'Il tempo che resta ricarica le energie.'} ${pz('C')<-.2?'Sei poco costante: delle ore di sport e studio che pianifichi ne farai solo una parte.':''}</div>${S.eta>=14?kv('Costo stimato al mese',eur(costoRoutineMese())):''}</div>`;
  return h;
}
function renderAttivita(V){
  let h='';
  if(S.malattie.length)h+=`<div class="sec">Salute</div><div class="panel">${S.malattie.map(m=>kv(esc(m.n),['','Lieve','Grave','Cronica','Gravissima'][m.g],'neg')).join('')}<div class="meta">Il medico di base cura le malattie lievi. Per quelle gravi servono lo specialista o la clinica. Le croniche si tengono sotto controllo con la terapia ogni anno.</div></div>`;
  const card=(a,lock,done,attr,costo,key)=>`<button class="act" ${attr} ${lock||done?'disabled':''}><span class="n">${a.n}</span><span class="d">${lock?`Dai ${a.min} anni`:a.d||''}</span><span class="c">${done?attesa(key):(costo?eur(costo):a.da?'da '+eur(P(a.da)):'Gratis')}${!done&&a.en!==0?` · energia ${a.en>0||a.en===undefined?'−':'+'}${Math.abs(a.en===undefined?8:a.en)}`:''}</span></button>`;
  if(S.carcere>0){
    const G=S.galera||{pena:S.carcere,scontata:0,condotta:0};
    h+=`<div class="sec">In carcere</div><div class="panel">${kv('Pena',`${G.pena} ${G.pena===1?'anno':'anni'}`)}${kv('Scontati',G.scontata)}${kv('Anni di buona condotta',G.condotta)}${G.banda?kv('Banda',esc(G.banda)):''}</div>
    <div class="grid2" style="margin-top:10px">${AZ_CARCERE.map(a=>card(Object.assign({en:0},a),false,fatto('c_'+a.id),`data-carc="${a.id}"`,0,'c_'+a.id)).join('')}</div>`;
    V.innerHTML=h;V.querySelectorAll('[data-carc]').forEach(b=>b.onclick=()=>faiAttivita(b.dataset.carc,true));return;
  }
  const tabs=[['settimana','Settimana'],['svago','Attività'],['social','Social'],['crimine','Crimine']];
  h+=`<div class="seg att-seg" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-at="${k}" aria-pressed="${attTab===k}">${l}</button>`).join('')}</div>`;
  if(attTab==='settimana')h+=renderSettimana();
  if(attTab==='svago'){
    const sez=[...new Set(ATTIVITA.map(a=>a.sez))];
    for(const s0 of sez){
      const acts=ATTIVITA.filter(a=>a.sez===s0&&(!a.max||S.eta<=a.max)&&(!a.cond||a.cond()));
      if(!acts.length)continue;
      h+=`<div class="sec">${s0}</div><div class="grid2">${acts.map(a=>card(a,S.eta<a.min,!a.ripeti&&fatto('att_'+a.id),`data-att="${a.id}"`,P(a.costo),'att_'+a.id)).join('')}</div>`;
    }
  }
  if(attTab==='social'){
    const so=S.social;
    if(S.eta<14)h+='<div class="panel"><div class="meta">Potrai aprire un profilo social a 14 anni: in Italia prima serve il consenso dei genitori.</div></div>';
    else if(!so.attivo)h+=`<div class="panel"><h3>Non hai un profilo</h3><div class="meta">Con tanti follower arrivano sponsor, fama e qualche guaio. Da 5.000 follower i marchi iniziano a pagarti.</div><button class="btn" id="btnApriSocial">Apri un profilo</button></div>`;
    else{
      h+=`<div class="panel"><div class="big">${nf(so.follower)}</div><div class="meta">follower · fama ${S.fama}/100${redditoSocial()?` · circa ${eur(redditoSocial())} l'anno dalle collaborazioni`:''}</div></div>
      <div class="sec">Pubblica</div><div class="grid2">${POST.map(pp=>card({n:pp.n,d:pp.d,min:13,en:0},false,fatto('post_'+pp.id),`data-post="${pp.id}"`,0,'post_'+pp.id)).join('')}
      ${card({n:'Compra 5.000 follower',d:'Rischi di farti scoprire',min:13,en:0},false,fatto('compra_fol'),'data-compra="1"',P(500),'compra_fol')}</div>
      <button class="btn ghost" id="btnChiudiSocial" style="margin-top:10px">Chiudi il profilo</button>`;
    }
  }
  if(attTab==='crimine'){
    const C=S.crim;
    h+=`<div class="panel"><div class="meta">Ogni colpo riuscito porta soldi ed esperienza. Se va male, il 70% delle volte ti arrestano. Il karma scende sempre.</div>${kv('Esperienza criminale',C.exp)}${kv('Colpi riusciti',C.colpi)}</div>
    <div class="sec">Colpi</div><div class="grid2">${CRIMINI.map(c=>`<button class="act" data-crim="${c.id}" ${S.eta<c.min||fatto('crim_'+c.id)?'disabled':''}><span class="n">${c.n}</span><span class="d">${S.eta<c.min?`Dai ${c.min} anni`:c.d}</span><span class="c">${fatto('crim_'+c.id)?attesa('crim_'+c.id):c.b[1]?`${eur(P(c.b[0]))}–${eur(P(c.b[1]))}`:'Solo per il brivido'}</span></button>`).join('')}</div>`;
    h+='<div class="sec">Malavita</div>';
    if(C.clan){const K=C.clan;
      h+=`<div class="panel"><h3>${esc(cap(K.nome))}</h3>${kv('Grado',`${GRADI_CLAN[K.grado]} (${K.grado+1} di ${GRADI_CLAN.length})`)}${kv('Lealtà',K.lealta+'%')}${bar(K.lealta,'--felicita')}${kv('Missioni compiute',K.missioni)}<div class="meta">Sotto il 25% di lealtà il capo inizia a sospettare di te.</div></div>
      <div class="grid2" style="margin-top:10px">${MISSIONI.map(m=>{const lock=K.grado<(m.grado||0);return `<button class="act" data-mis="${m.id}" ${lock||fatto('mis_'+m.id)?'disabled':''}><span class="n">${m.n}</span><span class="d">${lock?`Serve il grado ${GRADI_CLAN[m.grado].toLowerCase()}`:m.d}</span><span class="c">${fatto('mis_'+m.id)?attesa('mis_'+m.id):`${eur(P(m.b[0]))}–${eur(P(m.b[1]))}`}</span></button>`}).join('')}</div>
      <button class="btn ghost" id="btnLasciaClan" style="margin-top:10px">Esci dal clan</button>`;
    }else h+=`<div class="panel"><div class="meta">${S.eta<18?'Sei troppo giovane.':C.exp<4?'Ti serve più esperienza (almeno 4) perché qualcuno si fidi di te.':'Qualcuno ha sentito parlare di te.'}</div><button class="btn ghost" id="btnClan" ${S.eta<18||fatto('clan')?'disabled':''}>Avvicinati alla malavita</button></div>`;
  }
  V.innerHTML=h;
  V.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{attTab=b.dataset.at;render()});
  V.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const id=b.dataset.r,d=+b.dataset.d;S.routine[id]=Math.max(0,(S.routine[id]||0)+d);if(oreRoutine()>oreLibere())S.routine[id]-=d;save();render()});
  V.querySelectorAll('[data-sonno]').forEach(b=>b.onclick=()=>{S.sonno=Math.max(5,Math.min(10,S.sonno+(+b.dataset.sonno)));normalizzaRoutine();save();render()});
  V.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>faiAttivita(b.dataset.att));
  V.querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>azione(()=>pubblica(b.dataset.post)));
  V.querySelectorAll('[data-crim]').forEach(b=>b.onclick=()=>azione(()=>commettiCrimine(b.dataset.crim)));
  V.querySelectorAll('[data-mis]').forEach(b=>b.onclick=()=>azione(()=>missione(b.dataset.mis)));
  const on=(id,fn)=>{const b=$('#'+id);if(b)b.onclick=fn};
  on('btnApriSocial',()=>azione(()=>{S.social={attivo:true,follower:r(20,150),comprati:0};return ['Apri il tuo profilo. I primi follower sono amici e parenti.','g']}));
  on('btnChiudiSocial',()=>showSheet({k:'Social',t:'Chiudi il profilo?',p:'Perderai tutti i follower.',chiudi:true,scelte:[{l:'Chiudi',fx:()=>{S.social={attivo:false,follower:0,comprati:0};return ['Profilo chiuso. Che pace.','']}}]}));
  const cf=V.querySelector('[data-compra]');if(cf)cf.onclick=()=>azione(una('compra_fol',P(500),()=>{S.social.follower+=5000;S.social.comprati=1;return ['Arrivano 5.000 follower nuovi. Nessuno di loro commenta mai.','']}));
  on('btnClan',()=>azione(una('clan',0,avvicinaClan)));
  on('btnLasciaClan',()=>showSheet({k:'Malavita',t:'Uscire dal clan',p:'Dal clan non si esce facilmente.',chiudi:true,scelte:[{l:'Chiedi di andartene',sub:'45% di riuscita',fx:()=>lasciaClan(false)},{l:'Collabora con la giustizia',sub:'Ti proteggono, ma devi cambiare città',fx:()=>lasciaClan(true)}]}));
}

/* ---------- Logo e intro ---------- */
const logoSvg=()=>`<svg class="logo" viewBox="6 22 190 132" aria-hidden="true"><path class="tr" d="M20 104V71a21 21 0 0 1 42 0v33M62 71a21 21 0 0 1 42 0v33M157 140V99M157 99L133 53M157 99L181 53"/><circle class="testa" cx="157" cy="38" r="10"/></svg>`;
function intro(){
  const el=$('#intro');if(!el)return;
  const forza=/[?&]intro(=|&|$)/.test(location.search);
  const ridotto=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!forza&&(navigator.webdriver||ridotto)){el.remove();return}   // niente intro nei test automatici e con «riduci movimento»
  const via=()=>{if(!el.isConnected)return;el.classList.add('via');setTimeout(()=>el.remove(),320)};
  el.onclick=via;addEventListener('keydown',via,{once:true});
  setTimeout(()=>el.remove(),5050);
}

/* ---------- Creazione e necrologio ---------- */
function renderMorte(V){
  const figli=S.relazioni.filter(p=>p.ruolo==='Figlio');
  const nip=S.relazioni.filter(p=>p.ruolo==='Nipote').length;
  const con=S.relazioni.find(p=>p.vivo&&p.ruolo==='Coniuge');
  const ricordo=S.karma>=65?`Sarà ricordat${g('o','a')} come una persona generosa e buona.`:S.karma<=35?'Non tutti ne sentiranno la mancanza.':`Lascia un bel ricordo in chi l'ha conosciut${g('o','a')}.`;
  const eredi=figli.filter(p=>p.vivo);
  V.innerHTML=`<div class="obit"><div class="cross">✝</div><h2>${esc(S.nome)} ${esc(S.cognome)}</h2><div class="yrs">${S.annoNascita} – ${S.annoNascita+S.eta}</div>
  <p>Si è ${g('spento','spenta')} a ${S.eta} anni, ${esc(S.causa)}. ${ricordo}</p>
  <div class="facts">
   ${kv('Carattere',esc(descrPers(S.pers,S.sesso)))}
   ${S.aspir?kv('Sogni realizzati',`${(S.aspOk||[]).length} su ${S.aspir.length}`):''}
   ${kv('Titolo di studio',esc(titoloLabel()))}
   ${kv('Ultimo lavoro',esc(S.ultimoLavoro||'Nessuno'))}
   ${kv('Patrimonio',eur(patrimonio()))}
   ${kv('Coniuge',con?esc(con.nome):'—')}
   ${kv('Figli',figli.length)}${nip?kv('Nipoti',nip):''}
   ${kv('Fedina penale',S.fedina.length?'Sporca':'Pulita')}
   ${S.lusso&&S.lusso.onori.length?kv('Onorificenze',esc(S.lusso.onori.join(', '))):''}
   ${S.lusso&&S.lusso.fond?kv('Lascia',`la Fondazione ${esc(S.cognome)}`):''}
   ${S.lusso&&S.lusso.donato>=1000?kv('Ha donato',eur(S.lusso.donato*S.mondo.ip)):''}
   ${S.fama>0?kv('Fama',S.fama+'/100'):''}${S.social.follower?kv('Follower',nf(S.social.follower)):''}
   ${kv('Ultima residenza',esc(nomeLuogo(S.citta,S.prov)))}
  </div>
  <div class="btns">${eredi.map(p=>`<button class="btn" data-erede="${p.id}">Continua come ${esc(p.nome)} (${p.eta} anni)</button>`).join('')}
  <button class="btn ${eredi.length?'ghost':''}" id="btnRinasci">Vivi una vita nuova</button></div></div>`;
  V.querySelectorAll('[data-erede]').forEach(b=>b.onclick=()=>continuaCome(+b.dataset.erede));
  $('#btnRinasci').onclick=()=>{S=null;save();render()};
}
function render(){
  renderTop();
  const V=$('#view'),N=$('#nav');
  if(!S){N.hidden=true;renderCrea(V);return}
  if(!S.vivo){N.hidden=true;renderMorte(V);return}
  N.hidden=false;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  const st=V.scrollTop;
  ({vita:renderVita,scuola:renderScuola,lavoro:renderLavoro,persone:renderPersone,beni:renderBeni,attivita:renderAttivita})[tab](V);
  if(tab!=='vita')V.scrollTop=st;
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render();$('#view').scrollTop=0});
$('#btnAnno').onclick=()=>{tab='vita';mese()};
intro();load();render();initOnline();

</script>
